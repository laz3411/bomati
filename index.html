<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bomati Radar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 16:9 비율 컨테이너 - 모바일 중심 */
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vw; /* 기본값, JS로 16:9 보정 */
      max-height: 100vh;
      overflow: hidden;
      background: #0b0f19;
    }

    #mapCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 상단 상태 표시 */
    .status-hud {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 13px;
      border-radius: 20px;
      background: rgba(10, 14, 26, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      z-index: 20;
      pointer-events: none;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #888;
    }

    .status-live { color: #10b981; }
    .status-live .status-dot { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .status-waiting { color: #f59e0b; }
    .status-waiting .status-dot { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
    .status-offline { color: #ef4444; }
    .status-offline .status-dot { background: #ef4444; }

    /* 우측 하단 컨트롤 */
    .controls-fab {
      position: absolute;
      bottom: 22px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .btn-fab {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(10, 14, 26, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255,255,255,0.14);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: all 0.18s;
      font-size: 18px;
      font-weight: bold;
    }

    .btn-fab:active {
      transform: scale(0.93);
    }

    .btn-fab svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* 과녁(추적) 버튼 - 활성 상태 강조 */
    #lockBtn {
      border-color: rgba(56, 189, 248, 0.5);
    }

    #lockBtn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4), 0 4px 16px rgba(0,0,0,0.4);
    }

    /* 자유 이동 모드 힌트 토스트 */
    .toast {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 18px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      font-size: 11px;
      color: #94a3b8;
      z-index: 25;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }
  </style>

  <!-- Firebase Compat SDK (file:// & WebView 완벽 호환) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="viewport">
    <canvas id="mapCanvas"></canvas>

    <!-- 상태 HUD -->
    <div id="statusHud" class="status-hud status-waiting">
      <span class="status-dot"></span>
      <span id="statusText">연결 중...</span>
    </div>

    <!-- 우측 하단 FAB -->
    <div class="controls-fab">
      <button id="zoomInBtn" class="btn-fab" title="확대">+</button>
      <button id="zoomOutBtn" class="btn-fab" title="축소">−</button>
      <!-- 과녁(플레이어 추적 잠금) 버튼 -->
      <button id="lockBtn" class="btn-fab active" title="플레이어 추적">
        <!-- 과녁 아이콘 -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
          <path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
          <circle cx="12" cy="12" r="2"/>
        </svg>
      </button>
    </div>

    <!-- 자유 이동 모드 토스트 힌트 -->
    <div id="toast" class="toast">🔓 자유 이동 모드 — 과녁 버튼으로 복귀</div>
  </div>

  <script>
    // ==========================================
    // 설정 (코드 내장 고정값)
    // ==========================================
    const FIREBASE_DB_URL = "https://bumati-default-rtdb.asia-southeast1.firebasedatabase.app";

    const CONFIG = {
      minX: -2838, maxX: 1108,
      minZ: 432,   maxZ: 2531,
      invertX: true,
      invertZ: true,
      invertArrowX: true
    };

    // ==========================================
    // 뷰포트 - 16:9 강제 적용
    // ==========================================
    const vpEl = document.getElementById('viewport');
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    function applyViewport() {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      let vw, vh;

      // 16:9 비율을 화면 안에서 최대한 크게
      if (sw / sh > 16 / 9) {
        vh = sh;
        vw = Math.round(vh * 16 / 9);
      } else {
        vw = sw;
        vh = Math.round(vw * 9 / 16);
      }

      vpEl.style.width  = vw + 'px';
      vpEl.style.height = vh + 'px';
      vpEl.style.left   = ((sw - vw) / 2) + 'px';
      vpEl.style.top    = ((sh - vh) / 2) + 'px';
      vpEl.style.position = 'absolute';

      const dpr = window.devicePixelRatio || 1;
      canvas.width  = vw * dpr;
      canvas.height = vh * dpr;
      ctx.scale(dpr, dpr);

      vW = vw;
      vH = vh;
    }

    let vW = 0, vH = 0;
    window.addEventListener('resize', applyViewport);
    applyViewport();

    // ==========================================
    // 지도 이미지
    // ==========================================
    const mapImg = new Image();
    mapImg.src = 'image/realmap.png';
    let mapLoaded = false;

    mapImg.onload = () => {
      mapLoaded = true;
      // 초기 줌: 맵 짧은 변 기준으로 뷰 1/3 크기 (적당히 당겨진 기본 줌)
      baseScale = Math.min(vW, vH) / Math.min(mapImg.width, mapImg.height) * 2.2;
      viewScale = baseScale;
    };

    // ==========================================
    // 뷰포트 상태
    // ==========================================
    let viewX = 0, viewY = 0, viewScale = 1, viewRotation = 0;
    let baseScale = 1;

    // 추적 모드 여부
    let isLocked = true;

    // 추적할 메인 플레이어 (첫 번째로 들어온 플레이어)
    let primaryPlayerId = null;

    // ==========================================
    // 플레이어 데이터
    // ==========================================
    const playersMap = new Map();
    const COLORS = ['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#e11d48'];
    const getColor = (id) => COLORS[Math.abs(id || 0) % COLORS.length];

    // ==========================================
    // 좌표 변환
    // ==========================================
    function worldToMap(rx, rz) {
      let nx = (rx - CONFIG.minX) / (CONFIG.maxX - CONFIG.minX);
      let nz = (rz - CONFIG.minZ) / (CONFIG.maxZ - CONFIG.minZ);
      if (CONFIG.invertX) nx = 1 - nx;
      if (CONFIG.invertZ) nz = 1 - nz;
      return { x: nx * mapImg.width, y: nz * mapImg.height };
    }

    // ==========================================
    // 60FPS 렌더링
    // ==========================================
    let pulse = 0;

    function render() {
      requestAnimationFrame(render);

      const cw = vW, ch = vH;
      ctx.clearRect(0, 0, cw, ch);

      if (!mapLoaded) return;

      // 추적 모드: 주 플레이어 위치를 중심에, 방향에 맞게 회전
      if (isLocked && primaryPlayerId !== null && playersMap.has(primaryPlayerId)) {
        const p = playersMap.get(primaryPlayerId);
        // Lerp 각도
        const { x: px, y: py } = worldToMap(p.curX, p.curZ);

        // 맵 회전 각도: 플레이어 시선이 위를 향하도록
        // curAngle은 atan2(lookX, lookZ) - 이것이 0이면 +Z 방향(로블록스)
        // CONFIG.invertArrowX가 true면 -angle
        let targetRotation = CONFIG.invertArrowX ? -p.curAngle : p.curAngle;
        // 뒤집기 - 플레이어 위쪽이 화면 위쪽이 되도록 pi 추가
        targetRotation = targetRotation + Math.PI;

        // 부드러운 각도 보간 (가장 짧은 방향으로)
        let diff = targetRotation - viewRotation;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        viewRotation += diff * 0.12;

        // 중심을 플레이어 위치로
        viewX = cw / 2 - px * viewScale;
        viewY = ch / 2 - py * viewScale;
      }

      pulse += 0.06;

      // 변환 행렬 적용 (지도 중심 기준 회전)
      ctx.save();

      if (isLocked && primaryPlayerId !== null && playersMap.has(primaryPlayerId)) {
        const p = playersMap.get(primaryPlayerId);
        const { x: px, y: py } = worldToMap(p.curX, p.curZ);

        ctx.translate(cw / 2, ch / 2);
        ctx.rotate(-viewRotation);
        ctx.scale(viewScale, viewScale);
        ctx.translate(-px, -py);

        ctx.drawImage(mapImg, 0, 0);
        drawPlayers(ctx);
        ctx.restore();

      } else {
        // 자유 이동 모드 (회전 없음)
        ctx.translate(viewX, viewY);
        ctx.scale(viewScale, viewScale);
        ctx.drawImage(mapImg, 0, 0);
        drawPlayers(ctx);
        ctx.restore();
      }
    }

    function drawPlayers(ctx) {
      const pulseR = 9 + Math.sin(pulse) * 3;

      playersMap.forEach((p) => {
        p.curX += (p.targetX - p.curX) * 0.2;
        p.curZ += (p.targetZ - p.curZ) * 0.2;
        p.curAngle += (p.targetAngle - p.curAngle) * 0.2;

        const { x: px, y: py } = worldToMap(p.curX, p.curZ);

        // 펄스 링 (주 플레이어만)
        if (p.id === primaryPlayerId) {
          ctx.beginPath();
          ctx.arc(px, py, pulseR, 0, Math.PI * 2);
          ctx.strokeStyle = p.color + '88';
          ctx.lineWidth = 1.5 / viewScale;
          ctx.stroke();
        }

        // 시선 화살표 (작은 삼각형)
        if (typeof p.curAngle === 'number') {
          ctx.save();
          ctx.translate(px, py);
          let ang = CONFIG.invertArrowX ? -p.curAngle : p.curAngle;
          ctx.rotate(ang);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(5, -4);
          ctx.lineTo(-5, -4);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // 중앙 점 (작게)
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.lineWidth = 1.5 / viewScale;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // 닉네임 (작게)
        ctx.save();
        const fs = Math.max(9, 11 / Math.sqrt(viewScale));
        ctx.font = `600 ${fs}px sans-serif`;
        const name = p.displayName || p.name;
        const tw = ctx.measureText(name).width;

        const lx = px - tw / 2;
        const ly = py + 14;

        ctx.fillStyle = 'rgba(10,14,26,0.82)';
        ctx.fillRect(lx - 3, ly - fs, tw + 6, fs + 4);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(name, lx, ly);
        ctx.restore();
      });
    }

    requestAnimationFrame(render);

    // ==========================================
    // Firebase 실시간 수신
    // ==========================================
    const statusHud = document.getElementById('statusHud');
    const statusText = document.getElementById('statusText');

    function setStatus(state, text) {
      statusHud.className = `status-hud status-${state}`;
      statusText.textContent = text;
    }

    try {
      firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
      const db = firebase.database();
      const playersRef = db.ref('players');

      setStatus('waiting', '연결됨 — 대기');

      playersRef.on('value', (snap) => {
        const val = snap.val();
        if (!val) {
          setStatus('waiting', '플레이어 없음');
          playersMap.clear();
          return;
        }

        let list = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
        setStatus('live', `${list.length}명 접속 중`);

        // 주 플레이어 설정 (첫 번째 또는 기존 유지)
        if (primaryPlayerId === null && list.length > 0) {
          primaryPlayerId = list[0].id;
        }

        const activeIds = new Set();
        list.forEach(p => {
          if (!p || p.x === undefined) return;
          activeIds.add(p.id);
          if (playersMap.has(p.id)) {
            const e = playersMap.get(p.id);
            e.targetX = p.x; e.targetZ = p.z;
            e.targetAngle = p.angle || 0;
            e.displayName = p.displayName; e.name = p.name;
          } else {
            playersMap.set(p.id, {
              id: p.id, name: p.name, displayName: p.displayName,
              curX: p.x, curZ: p.z, curAngle: p.angle || 0,
              targetX: p.x, targetZ: p.z, targetAngle: p.angle || 0,
              color: getColor(p.id)
            });
          }
        });

        for (const id of playersMap.keys()) {
          if (!activeIds.has(id)) playersMap.delete(id);
        }
      }, () => setStatus('offline', 'DB 오류'));

    } catch (e) {
      setStatus('offline', '초기화 실패');
    }

    // ==========================================
    // 터치/마우스 Pan & Pinch Zoom (자유 이동 모드)
    // ==========================================
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function unlockIfLocked() {
      if (isLocked) {
        // 현재 렌더링 상태를 viewX/Y에 반영하고 잠금 해제
        viewRotation = 0; // 자유모드에서는 회전 없이
        isLocked = false;
        lockBtn.classList.remove('active');
        showToast('🔓 자유 이동 모드 — 과녁 버튼으로 복귀');
      }
    }

    let isDrag = false;
    let dragSX = 0, dragSY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1;

    canvas.addEventListener('pointerdown', (e) => {
      // 단일 터치면 드래그 시작
      canvas.setPointerCapture(e.pointerId);
      isDrag = true;
      dragSX = e.clientX - viewX;
      dragSY = e.clientY - viewY;
      unlockIfLocked();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrag || isLocked) return;
      viewX = e.clientX - dragSX;
      viewY = e.clientY - dragSY;
    });

    canvas.addEventListener('pointerup', () => {
      isDrag = false;
    });

    // 핀치 줌 (멀티터치)
    let activePointers = new Map();

    canvas.addEventListener('touchstart', (e) => {
      for (const t of e.changedTouches) {
        activePointers.set(t.identifier, { x: t.clientX, y: t.clientY });
      }
      if (activePointers.size === 2) {
        const pts = [...activePointers.values()];
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        pinchStartScale = viewScale;
        isDrag = false;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        activePointers.set(t.identifier, { x: t.clientX, y: t.clientY });
      }

      if (activePointers.size === 2) {
        const pts = [...activePointers.values()];
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const newScale = Math.min(Math.max(pinchStartScale * (dist / pinchStartDist), 0.15), 8.0);

        const cx = (pts[0].x + pts[1].x) / 2;
        const cy = (pts[0].y + pts[1].y) / 2;
        viewX = cx - (cx - viewX) * (newScale / viewScale);
        viewY = cy - (cy - viewY) * (newScale / viewScale);
        viewScale = newScale;
      } else if (activePointers.size === 1 && !isLocked) {
        const [pt] = activePointers.values();
        viewX = pt.x - dragSX;
        viewY = pt.y - dragSY;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      for (const t of e.changedTouches) {
        activePointers.delete(t.identifier);
      }
    }, { passive: true });

    // 마우스 휠 줌
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      unlockIfLocked();
      const factor = e.deltaY < 0 ? 1.15 : 0.87;
      const newScale = Math.min(Math.max(viewScale * factor, 0.15), 8.0);
      const mx = e.clientX - vpEl.getBoundingClientRect().left;
      const my = e.clientY - vpEl.getBoundingClientRect().top;
      viewX = mx - (mx - viewX) * (newScale / viewScale);
      viewY = my - (my - viewY) * (newScale / viewScale);
      viewScale = newScale;
    }, { passive: false });

    // ==========================================
    // 컨트롤 버튼
    // ==========================================
    const lockBtn = document.getElementById('lockBtn');

    lockBtn.addEventListener('click', () => {
      isLocked = true;
      viewRotation = 0;
      lockBtn.classList.add('active');
      toast.classList.remove('show');
    });

    document.getElementById('zoomInBtn').addEventListener('click', () => {
      viewScale = Math.min(viewScale * 1.3, 8.0);
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      viewScale = Math.max(viewScale * 0.77, 0.15);
    });

    applyViewport();
  </script>
</body>
</html>
