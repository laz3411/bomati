<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bomati GPS Radar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0b0f19;
      overflow: hidden;
      display: block;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 기기 화면에 맞춘 전체화면 반응형 뷰포트 */
    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0b0f19;
    }

    #mapCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 우측 하단 플로팅 컨트롤 (모바일 Safe Area 반영) */
    .controls-fab {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      right: calc(18px + env(safe-area-inset-right, 0px));
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .btn-fab {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
      font-size: 19px;
      font-weight: bold;
    }

    .btn-fab:active {
      transform: scale(0.92);
    }

    .btn-fab svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* 과녁(GPS 추적) 버튼 */
    #lockBtn {
      border-color: rgba(56, 189, 248, 0.4);
    }

    #lockBtn.active {
      background: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6), 0 4px 14px rgba(0, 0, 0, 0.4);
      color: #fff;
    }

    /* 자유 이동 안내 토스트 (모바일 Safe Area 반영) */
    .toast {
      position: absolute;
      bottom: calc(82px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 18px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      z-index: 25;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }

    /* 하차 예약 바텀 시트 (모바일 최적화) */
    .reservation-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 70%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1.5px solid rgba(255, 255, 255, 0.15);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }

    .reservation-sheet.active {
      transform: translateY(0);
    }

    .sheet-header {
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sheet-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bus-route-badge {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      padding: 3px 9px;
      border-radius: 6px;
      background: #0284c7;
    }

    .bus-floor-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      color: #fff;
    }
    .badge-low { background: #16a34a; }
    .badge-high { background: #ea580c; }

    .bell-status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      background: #e11d48;
      color: #fff;
      animation: pulseBell 1s infinite;
    }
    @keyframes pulseBell {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    .btn-close-sheet {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .sheet-body {
      padding: 12px 18px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .current-stop-info {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .current-stop-name {
      color: #38bdf8;
      font-weight: 600;
    }

    .stop-list-title {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .stop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 7px;
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      transition: background 0.2s;
    }
    .stop-item.reserved {
      background: rgba(2, 132, 199, 0.2);
      border-color: #38bdf8;
    }

    .stop-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stop-index-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stop-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .stop-dist {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .btn-reserve {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reserve:active { transform: scale(0.95); }

    .btn-reserved {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 근처 버스 알림 플로팅 버튼 */
    .nearby-bus-pill {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 24px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      z-index: 25;
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
      transition: all 0.25s;
    }

    /* 하차벨 자동 알림 팝업 배너 */
    .bell-alert-banner {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(-150%);
      background: linear-gradient(135deg, #e11d48, #be123c);
      border: 1.5px solid #fda4af;
      border-radius: 14px;
      padding: 12px 20px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      z-index: 50;
      box-shadow: 0 8px 25px rgba(225, 29, 72, 0.5);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: pre-line;
      pointer-events: none;
    }
    .bell-alert-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    /* 상단 좌측 실시간 상태 HUD */
    .status-hud {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top, 0px));
      left: calc(14px + env(safe-area-inset-left, 0px));
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 9px 13px;
      color: #e2e8f0;
      font-size: 12px;
      z-index: 25;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 170px;
      pointer-events: auto;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      box-shadow: 0 0 6px #eab308;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .status-title {
      font-weight: 700;
      font-size: 12px;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }

    .status-sub {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .status-player-badge {
      color: #38bdf8;
      font-weight: 600;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-select {
      background: rgba(30, 41, 59, 0.9);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 4px;
      outline: none;
      cursor: pointer;
      max-width: 120px;
    }
  </style>

  <!-- 웹뷰(APK) 및 file:// 호환 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="viewport">
    <canvas id="mapCanvas"></canvas>

    <!-- 상단 좌측 실시간 상태 HUD -->
    <div id="statusHud" class="status-hud">
      <div class="status-row">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusTitle" class="status-title">Firebase 연결 대기 중...</span>
      </div>
      <div class="status-sub">
        <span>내 위치:</span>
        <span id="statusPlayerBadge" class="status-player-badge">대기 중...</span>
        <select id="playerSelect" class="player-select" style="display: none;"></select>
      </div>
      <div class="status-sub">
        <span>주변 버스:</span>
        <span id="statusBusCount" style="color: #cbd5e1; font-weight: 600;">0대</span>
      </div>
    </div>

    <!-- 근처 버스 알림 플로팅 버튼 -->
    <div id="nearbyBusPill" class="nearby-bus-pill" style="display: none;"></div>

    <!-- 하차벨 자동 알림 배너 -->
    <div id="bellAlertBanner" class="bell-alert-banner"></div>

    <!-- 우측 하단 컨트롤 -->
    <div class="controls-fab">
      <button id="zoomInBtn" class="btn-fab" title="확대">+</button>
      <button id="zoomOutBtn" class="btn-fab" title="축소">−</button>
      <!-- 과녁(내 위치 추적 고정) 버튼 -->
      <button id="lockBtn" class="btn-fab active" title="내 위치 추적">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
          <path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
          <circle cx="12" cy="12" r="2.5"/>
        </svg>
      </button>
    </div>

    <!-- 하차 예약 바텀 시트 -->
    <div id="reservationSheet" class="reservation-sheet">
      <div class="sheet-header">
        <div class="sheet-title-group">
          <span id="sheetRouteBadge" class="bus-route-badge">BUS</span>
          <span id="sheetFloorBadge" class="bus-floor-badge badge-low">저상</span>
          <span id="sheetBellBadge" class="bell-status-badge" style="display: none;">🔔 하차벨 울림</span>
        </div>
        <button class="btn-close-sheet" onclick="closeReservationSheet()">✕</button>
      </div>
      <div class="sheet-body">
        <div class="current-stop-info">
          현재 위치: <span id="sheetCurrentStop" class="current-stop-name">운행 중</span>
        </div>
        <div class="stop-list-title">다음 하차 가능 정류장 (남은 정류장 목록)</div>
        <div id="sheetStopList"></div>
      </div>
    </div>

    <!-- 자유 이동 모드 토스트 -->
    <div id="toast" class="toast">자유 이동 모드 (과녁 클릭 시 내 위치 복귀)</div>
  </div>

  <script>
    // ==========================================
    // 1. 고정 설정 & 발표용 타겟 사용자
    // ==========================================
    const FIREBASE_DB_URL = "https://bumati-default-rtdb.asia-southeast1.firebasedatabase.app";

    // Roblox의 실제 영어 사용자명(Player.Name)을 넣으세요. 표시명(DisplayName)은 사용하지 않습니다.
    // 이 계정만 지도에 표시됩니다.
    const TARGET_ROBLOX_USER_NAME = "laz3411";

    const CONFIG = {
      minX: -2838, maxX: 1108,
      minZ: 432,   maxZ: 2531,
      invertX: true,
      invertZ: true,
      invertArrowX: true
    };

    // ==========================================
    // 2. 기기 화면 맞춤 반응형 뷰포트
    // ==========================================
    const vpEl = document.getElementById('viewport');
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let vW = 0, vH = 0;

    function applyViewport() {
      // visualViewport를 우선 감지하여 모바일 주소창/하단바/가상키보드 변화에 대응
      const vw = window.visualViewport ? Math.round(window.visualViewport.width) : window.innerWidth;
      const vh = window.visualViewport ? Math.round(window.visualViewport.height) : window.innerHeight;

      vpEl.style.width = vw + 'px';
      vpEl.style.height = vh + 'px';

      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);
      canvas.style.width = vw + 'px';
      canvas.style.height = vh + 'px';

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      vW = vw;
      vH = vh;
    }

    window.addEventListener('resize', applyViewport);
    window.addEventListener('orientationchange', () => {
      setTimeout(applyViewport, 150);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', applyViewport);
    }
    applyViewport();

    // ==========================================
    // 3. 지도 이미지 및 내비게이션 줌
    // ==========================================
    const mapImg = new Image();
    mapImg.src = 'image/realmap.png';
    let mapLoaded = false;

    // 뷰포트 상태
    let viewX = 0, viewY = 0, viewScale = 1.0, viewRotation = 0;
    let isLocked = true; // 기본: 내 위치 및 방향 자동 추적 모드

    mapImg.onload = () => {
      mapLoaded = true;
      const currentVW = vW || window.innerWidth;
      const currentVH = vH || window.innerHeight;
      // 내비게이션 앱에 맞게 적당히 가까이 당겨진 기본 줌 (3.2배)
      viewScale = (Math.min(currentVW, currentVH) / Math.min(mapImg.width, mapImg.height)) * 3.2;
      viewX = (currentVW - mapImg.width * viewScale) / 2;
      viewY = (currentVH - mapImg.height * viewScale) / 2;
    };

    // ==========================================
    // 4. 좌표 변환 함수
    // ==========================================
    function worldToMap(rx, rz) {
      let nx = (rx - CONFIG.minX) / (CONFIG.maxX - CONFIG.minX);
      let nz = (rz - CONFIG.minZ) / (CONFIG.maxZ - CONFIG.minZ);
      if (CONFIG.invertX) nx = 1 - nx;
      if (CONFIG.invertZ) nz = 1 - nz;
      return { x: nx * mapImg.width, y: nz * mapImg.height };
    }

    // ==========================================
    // 5. 플레이어(GPS) 및 Roblox BUS 태그 차량 데이터
    // ==========================================
    let targetPlayer = null;
    const buses = new Map();

    function normalizeAngle(angle) {
      if (typeof angle !== 'number' || Number.isNaN(angle)) return 0;
      while (angle > Math.PI) angle -= Math.PI * 2;
      while (angle < -Math.PI) angle += Math.PI * 2;
      return angle;
    }

    function lerpAngle(current, target, amount) {
      let diff = normalizeAngle(target - current);
      return normalizeAngle(current + diff * amount);
    }

    function upsertBus(rawBus) {
      if (!rawBus || rawBus.x === undefined || rawBus.z === undefined) return;

      const id = String(rawBus.id || rawBus.name || `${rawBus.x},${rawBus.z}`);
      const nextAngle = normalizeAngle(rawBus.angle || 0);
      const existing = buses.get(id);

      if (!existing) {
        buses.set(id, {
          id,
          name: rawBus.name || '',
          route: rawBus.route || '',
          isHighFloor: rawBus.isHighFloor === true,
          curX: Number(rawBus.x),
          curZ: Number(rawBus.z),
          curAngle: nextAngle,
          targetX: Number(rawBus.x),
          targetZ: Number(rawBus.z),
          targetAngle: nextAngle,
          currentStop: rawBus.currentStop || null,
          upcomingStops: rawBus.upcomingStops || [],
          allStops: rawBus.allStops || [],
          isBellRinging: rawBus.isBellRinging === true,
          lastSeen: Date.now()
        });
        return;
      }

      existing.name = rawBus.name || existing.name;
      existing.route = rawBus.route || existing.route;
      existing.isHighFloor = rawBus.isHighFloor === true;
      existing.targetX = Number(rawBus.x);
      existing.targetZ = Number(rawBus.z);
      existing.targetAngle = nextAngle;
      existing.currentStop = rawBus.currentStop || existing.currentStop;
      existing.upcomingStops = rawBus.upcomingStops || existing.upcomingStops;
      existing.allStops = rawBus.allStops || existing.allStops;
      existing.isBellRinging = rawBus.isBellRinging === true;
      existing.lastSeen = Date.now();

      if (selectedBusId === id) {
        renderReservationSheet();
      }
    }

    function replaceBuses(rawBuses) {
      const liveIds = new Set();
      (rawBuses || []).forEach((bus) => {
        const id = String(bus.id || bus.name || `${bus.x},${bus.z}`);
        liveIds.add(id);
        upsertBus(bus);
      });

      for (const [id, bus] of buses) {
        if (!liveIds.has(id) || Date.now() - bus.lastSeen > 15000) {
          buses.delete(id);
        }
      }

      if (typeof updateStatusHud === 'function') {
        updateStatusHud();
      }

      // 플레이어가 아직 없고 초기 뷰 포커스가 안 된 상태에서 버스가 있으면 첫 번째 버스를 화면 중앙에 맞춤
      if (!targetPlayer && !isInitialCameraFocused && buses.size > 0 && mapLoaded) {
        const firstBus = buses.values().next().value;
        if (firstBus) {
          const { x: bx, y: by } = worldToMap(firstBus.curX, firstBus.curZ);
          viewX = vW / 2 - bx * viewScale;
          viewY = vH / 2 - by * viewScale;
        }
      }
    }

    // ==========================================
    // 6. 60FPS 내비게이션 렌더링 루프
    // ==========================================
    let pulse = 0;

    function render() {
      requestAnimationFrame(render);

      const cw = vW, ch = vH;
      ctx.clearRect(0, 0, cw, ch);

      if (!mapLoaded) return;

      pulse += 0.05;

      if (targetPlayer) {
        // 부드러운 위치/각도 보간 (Lerp)
        targetPlayer.curX += (targetPlayer.targetX - targetPlayer.curX) * 0.22;
        targetPlayer.curZ += (targetPlayer.targetZ - targetPlayer.curZ) * 0.22;
        targetPlayer.curAngle = lerpAngle(targetPlayer.curAngle, targetPlayer.targetAngle, 0.22);
      }

      for (const bus of buses.values()) {
        bus.curX += (bus.targetX - bus.curX) * 0.2;
        bus.curZ += (bus.targetZ - bus.curZ) * 0.2;
        bus.curAngle = lerpAngle(bus.curAngle, bus.targetAngle, 0.2);
      }

      ctx.save();

      // [잠금 모드]: 플레이어가 화면 정중앙, 플레이어 진행 방향이 항상 화면 위쪽
      if (isLocked && targetPlayer) {
        const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);

        // 진행 방향 각도 보정
        let targetRotation = CONFIG.invertArrowX ? -targetPlayer.curAngle : targetPlayer.curAngle;
        targetRotation = targetRotation + Math.PI;

        // 최단 회전 보간
        let diff = targetRotation - viewRotation;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        viewRotation += diff * 0.12;

        // 화면 중심(약간 아래쪽 60% 지점 - 자동차 내비게이션처럼 앞 시야 확보)
        const centerScreenY = ch * 0.58;

        ctx.translate(cw / 2, centerScreenY);
        ctx.rotate(-viewRotation);
        ctx.scale(viewScale, viewScale);
        ctx.translate(-px, -py);

        // 지도 렌더링
        ctx.drawImage(mapImg, 0, 0);

        drawStopMarkers(ctx);
        drawBusMarkers(ctx);

        // GPS 마커 렌더링
        drawGpsMarker(ctx, px, py, targetPlayer.curAngle);
        ctx.restore();

      } else {
        // [자유 이동 모드]: 정방향 자유 탐색
        ctx.translate(viewX, viewY);
        ctx.scale(viewScale, viewScale);

        ctx.drawImage(mapImg, 0, 0);

        drawStopMarkers(ctx);
        drawBusMarkers(ctx);

        if (targetPlayer) {
          const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);
          drawGpsMarker(ctx, px, py, targetPlayer.curAngle);
        }

        ctx.restore();
      }

      updateNearbyBusNotification();
    }

    function drawStopMarkers(ctx) {
      const renderedStopKeys = new Set();

      for (const bus of buses.values()) {
        const stopsToDraw = (bus.allStops && bus.allStops.length > 0) ? bus.allStops : (bus.upcomingStops || []);
        const busKey = bus.id.replace(/[.#$/[\]]/g, '_');
        const res = currentReservations[busKey];

        stopsToDraw.forEach((stop) => {
          const key = `${stop.x},${stop.z}`;
          if (renderedStopKeys.has(key)) return;
          renderedStopKeys.add(key);

          const { x: px, y: py } = worldToMap(stop.x, stop.z);
          const isReserved = res && Number(res.targetStopIndex) === Number(stop.index);

          ctx.save();
          ctx.translate(px, py);

          if (isReserved) {
            // 예약된 정류장은 화려한 펄스 링 표시
            const pulseR = 12 + Math.sin(pulse * 2) * 4;
            ctx.beginPath();
            ctx.arc(0, 0, pulseR / viewScale, 0, Math.PI * 2);
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2.5 / viewScale;
            ctx.stroke();

            ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
            ctx.fill();
          }

          // 기본 정류장 핀
          ctx.beginPath();
          ctx.arc(0, 0, 4.5 / viewScale, 0, Math.PI * 2);
          ctx.fillStyle = isReserved ? '#fbbf24' : '#0284c7';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.2 / viewScale;
          ctx.fill();
          ctx.stroke();

          // 정류장 번호 또는 이름 라벨
          ctx.font = `bold ${Math.max(7 / viewScale, 4.2)}px -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.lineWidth = 2.2 / viewScale;
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.fillStyle = isReserved ? '#fef08a' : '#f8fafc';
          const label = isReserved ? `🔔 ${stop.name || stop.index}` : String(stop.name || stop.index);
          ctx.strokeText(label, 0, -6 / viewScale);
          ctx.fillText(label, 0, -6 / viewScale);

          ctx.restore();
        });
      }
    }

    function drawBusMarkers(ctx) {
      for (const bus of buses.values()) {
        const { x, y } = worldToMap(bus.curX, bus.curZ);
        drawBusMarker(ctx, x, y, bus.curAngle, bus);
      }
    }

    function drawBusMarker(ctx, px, py, angle, bus) {
      const width = 15;
      const height = 36;
      const routeText = String(bus.route || bus.name || 'BUS').slice(0, 8);
      const floorText = bus.isHighFloor ? '고상' : '저상';
      const fill = bus.isHighFloor ? '#f97316' : '#16a34a';
      const isSelected = bus.id === selectedBusId;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(CONFIG.invertArrowX ? -angle : angle);

      // 선택된 버스일 경우 외곽 하이라이트 링
      if (isSelected) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.2 / viewScale;
        roundRect(ctx, -width / 2 - 3, -height / 2 - 3, width + 6, height + 6, 4);
        ctx.stroke();
      }

      // 진행 방향을 길쭉한 차체와 앞쪽 흰 선으로 표현합니다.
      ctx.fillStyle = 'rgba(15, 23, 42, 0.42)';
      ctx.fillRect(-width / 2 + 1.6, -height / 2 + 1.8, width, height);

      ctx.fillStyle = fill;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.1 / viewScale;
      roundRect(ctx, -width / 2, -height / 2, width, height, 2.5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-width / 2 + 2.2, -height / 2 + 2.8, width - 4.4, 3);

      ctx.font = `${Math.max(8 / viewScale, 4.5)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 2 / viewScale;
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.78)';
      ctx.fillStyle = '#ffffff';
      ctx.save();
      ctx.rotate(-Math.PI / 2);
      ctx.strokeText(routeText, 0, 1);
      ctx.fillText(routeText, 0, 1);
      ctx.restore();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.moveTo(0, -height / 2 - 7);
      ctx.lineTo(5.2, -height / 2 - 1);
      ctx.lineTo(-5.2, -height / 2 - 1);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.font = `${Math.max(7 / viewScale, 4.5)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 2.4 / viewScale;
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillStyle = '#ffffff';
      ctx.strokeText(floorText, px, py + 12 / viewScale);
      ctx.fillText(floorText, px, py + 12 / viewScale);

      // 하차벨 작동 중일 때 머리 위에 깜빡이는 🔔 표시
      if (bus.isBellRinging) {
        ctx.font = `${Math.max(12 / viewScale, 7)}px -apple-system, sans-serif`;
        ctx.fillText('🔔', px, py - 24 / viewScale);
      }

      ctx.restore();
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // 세련된 모바일 GPS 내비게이션 위치 마커 (크기 축소 & 닉네임 미표시)
    function drawGpsMarker(ctx, px, py, angle) {
      const pulseR = 8 + Math.sin(pulse) * 3;

      // 1. 외곽 은은한 펄스 링 (내비게이션 GPS 느낌)
      ctx.beginPath();
      ctx.arc(px, py, pulseR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.lineWidth = 1.2 / viewScale;
      ctx.stroke();

      // 2. 방향 표시 삼각형 화살표 (축소된 크기)
      if (typeof angle === 'number') {
        ctx.save();
        ctx.translate(px, py);
        let ang = CONFIG.invertArrowX ? -angle : angle;
        ctx.rotate(ang);

        // 내비게이션 화살표 헤드
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.moveTo(0, -9.5);
        ctx.lineTo(4.2, -3.2);
        ctx.lineTo(-4.2, -3.2);
        ctx.closePath();
        ctx.fill();

        // 화살표 테두리
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.8 / viewScale;
        ctx.stroke();
        ctx.restore();
      }

      // 3. 중심 GPS 원형 닷 (반지름 3.5px)
      ctx.beginPath();
      ctx.arc(px, py, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#0284c7';
      ctx.fill();
      ctx.lineWidth = 1.2 / viewScale;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    requestAnimationFrame(render);

    // ==========================================
    // 7. Firebase 실시간 데이터 수신 및 HUD 상태 동기화
    // ==========================================
    let isFirebaseConnected = false;
    let activePlayerList = [];
    let selectedPlayerName = "";
    let isInitialCameraFocused = false;

    const statusDot = document.getElementById('statusDot');
    const statusTitle = document.getElementById('statusTitle');
    const statusPlayerBadge = document.getElementById('statusPlayerBadge');
    const playerSelect = document.getElementById('playerSelect');
    const statusBusCount = document.getElementById('statusBusCount');

    function updateStatusHud() {
      if (statusDot) {
        statusDot.className = 'status-dot ' + (isFirebaseConnected ? 'online' : 'offline');
      }
      if (statusTitle) {
        statusTitle.textContent = isFirebaseConnected ? 'Firebase 실시간 연결됨' : 'Firebase 연결 대기 중...';
      }
      if (statusPlayerBadge) {
        if (targetPlayer) {
          statusPlayerBadge.textContent = `${targetPlayer.name || '알 수 없음'} (X:${Math.round(targetPlayer.curX)}, Z:${Math.round(targetPlayer.curZ)})`;
          statusPlayerBadge.style.color = '#38bdf8';
        } else {
          statusPlayerBadge.textContent = isFirebaseConnected ? '위치 대기 중 (게임 미접속)' : '연결 중...';
          statusPlayerBadge.style.color = '#94a3b8';
        }
      }
      if (statusBusCount) {
        statusBusCount.textContent = `${buses.size}대`;
      }
    }

    function updatePlayerSelectUI() {
      if (!playerSelect || !statusPlayerBadge) return;
      if (activePlayerList.length > 1) {
        statusPlayerBadge.style.display = 'none';
        playerSelect.style.display = 'inline-block';
        playerSelect.innerHTML = '';
        activePlayerList.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.textContent = p.name + (p.displayName && p.displayName !== p.name ? ` (${p.displayName})` : '');
          if (selectedPlayerName && p.name.toLowerCase() === selectedPlayerName.toLowerCase()) {
            opt.selected = true;
          }
          playerSelect.appendChild(opt);
        });
      } else {
        playerSelect.style.display = 'none';
        statusPlayerBadge.style.display = 'inline-block';
      }
    }

    if (playerSelect) {
      playerSelect.addEventListener('change', (e) => {
        selectedPlayerName = e.target.value;
        updateTargetPlayer(activePlayerList);
        if (targetPlayer) {
          isLocked = true;
          lockBtn.classList.add('active');
          showToast(`📍 [${targetPlayer.name}] 플레이어로 추적 변경`);
        }
      });
    }

    try {
      firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
      const db = firebase.database();

      function normalizeList(value) {
        if (!value) return [];
        return Array.isArray(value) ? value.filter(Boolean) : Object.values(value).filter(Boolean);
      }

      function updateTargetPlayer(players) {
        const list = normalizeList(players).filter(p =>
          p && typeof p === 'object' &&
          Number.isFinite(Number(p.x)) &&
          Number.isFinite(Number(p.z))
        );

        activePlayerList = list;
        updatePlayerSelectUI();

        if (list.length === 0) {
          targetPlayer = null;
          updateStatusHud();
          return;
        }

        // 1순위: 사용자가 UI에서 명시적으로 선택한 플레이어
        let found = null;
        if (selectedPlayerName) {
          found = list.find(p => p.name && p.name.toLowerCase() === selectedPlayerName.toLowerCase());
        }

        // 2순위: 설정된 TARGET_ROBLOX_USER_NAME ("laz3411")과 일치하는 플레이어
        if (!found && TARGET_ROBLOX_USER_NAME) {
          found = list.find(p => p.name && p.name.toLowerCase() === TARGET_ROBLOX_USER_NAME.toLowerCase());
        }

        // 3순위: 일치하는 대상이 없으면 접속 중인 첫 번째 플레이어 자동 선택!
        if (!found) {
          found = list[0];
        }

        if (found) {
          selectedPlayerName = found.name;
          const x = Number(found.x);
          const z = Number(found.z);
          const angle = Number(found.angle) || 0;

          const isFirstDetection = !targetPlayer;

          if (!targetPlayer) {
            targetPlayer = {
              id: found.id,
              name: found.name,
              curX: x, curZ: z, curAngle: angle,
              targetX: x, targetZ: z, targetAngle: angle
            };
          } else {
            targetPlayer.id = found.id;
            targetPlayer.name = found.name;
            targetPlayer.targetX = x;
            targetPlayer.targetZ = z;
            targetPlayer.targetAngle = angle;
          }

          // 처음 위치가 인식된 순간: 플레이어 위치로 카메라 자동 고정 및 알림
          if (isFirstDetection || !isInitialCameraFocused) {
            isInitialCameraFocused = true;
            isLocked = true;
            lockBtn.classList.add('active');
            showToast(`📍 [${found.name}] 위치가 인식되었습니다!`);
          }
        } else {
          targetPlayer = null;
        }

        updateStatusHud();
      }

      // Firebase 연결 상태 모니터링
      db.ref('.info/connected').on('value', (snap) => {
        isFirebaseConnected = snap.val() === true;
        updateStatusHud();
      });

      // 1) 통합 radar 노드 구독 (players, buses, bell)
      db.ref('radar').on('value', (snap) => {
        const val = snap.val();
        if (!val) {
          targetPlayer = null;
          replaceBuses([]);
          updateStatusHud();
          return;
        }

        if (val.players !== undefined) {
          updateTargetPlayer(val.players);
        }
        if (val.buses !== undefined) {
          replaceBuses(normalizeList(val.buses));
        }
        updateStatusHud();
      });

      // 2) 별도 /players 노드도 동시 구독 (다양한 스크립트/모의 전송 데이터 완벽 호환)
      db.ref('players').on('value', (snap) => {
        const playersVal = snap.val();
        if (playersVal) {
          updateTargetPlayer(playersVal);
        }
      });

    } catch (e) {
      console.error("Firebase 초기화 에러:", e);
      if (statusTitle) statusTitle.textContent = "Firebase 연결 오류";
    }

    // ==========================================
    // 8. 모바일 터치 및 인터랙션 (잠금 / 자유 이동)
    // ==========================================
    const lockBtn = document.getElementById('lockBtn');
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function unlockToFreeMove() {
      if (isLocked) {
        if (targetPlayer) {
          const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);
          viewX = vW / 2 - px * viewScale;
          viewY = (vH * 0.58) - py * viewScale;
        }
        isLocked = false;
        viewRotation = 0;
        lockBtn.classList.remove('active');
        showToast('자유 이동 모드 (과녁 클릭 시 내 위치 복귀)');
      }
    }

    // 과녁 버튼 클릭 시: 내 위치 추적 모드로 즉시 복귀 (플레이어가 없으면 버스/정류장으로 이동)
    lockBtn.addEventListener('click', () => {
      if (targetPlayer) {
        isLocked = true;
        viewRotation = 0;
        lockBtn.classList.add('active');
        toast.classList.remove('show');
        showToast(`📍 [${targetPlayer.name}] 내 위치 추적 모드`);
      } else if (buses.size > 0) {
        const firstBus = buses.values().next().value;
        if (firstBus) {
          const { x: bx, y: by } = worldToMap(firstBus.curX, firstBus.curZ);
          viewX = vW / 2 - bx * viewScale;
          viewY = vH / 2 - by * viewScale;
          isLocked = false;
          viewRotation = 0;
          lockBtn.classList.remove('active');
          showToast(`🚌 [${firstBus.route || firstBus.name || '버스'}] 위치로 이동`);
        }
      } else {
        showToast('위치 데이터 수신 대기 중입니다.');
      }
    });

    // 드래그 & 터치 이동
    let isDrag = false;
    let dragSX = 0, dragSY = 0;
    let dragStartX = 0, dragStartY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let activeTouches = new Map();

    function screenToMap(sx, sy) {
      if (isLocked && targetPlayer) {
        const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);
        const centerScreenY = vH * 0.58;
        const dx = sx - vW / 2;
        const dy = sy - centerScreenY;
        const cos = Math.cos(viewRotation);
        const sin = Math.sin(viewRotation);
        const rx = (dx * cos - dy * sin) / viewScale;
        const ry = (dx * sin + dy * cos) / viewScale;
        return { x: px + rx, y: py + ry };
      } else {
        return { x: (sx - viewX) / viewScale, y: (sy - viewY) / viewScale };
      }
    }

    function updateNearbyBusNotification() {
      const pill = document.getElementById('nearbyBusPill');
      if (!pill) return;

      if (!targetPlayer || buses.size === 0) {
        pill.style.display = 'none';
        return;
      }

      let nearestBus = null;
      let minDistance = 250; // 약 250 studs 이내 버스 접근 감지

      for (const bus of buses.values()) {
        const d = Math.hypot(targetPlayer.curX - bus.curX, targetPlayer.curZ - bus.curZ);
        if (d < minDistance) {
          minDistance = d;
          nearestBus = bus;
        }
      }

      if (nearestBus) {
        pill.style.display = 'flex';
        pill.innerHTML = `<span>🚌 <b>${nearestBus.route || nearestBus.name || 'BUS'}</b> 버스 접근 중 (${Math.round(minDistance)}m) · <b>하차 예약</b></span>`;
        pill.onclick = () => openReservationSheet(nearestBus.id);
      } else {
        pill.style.display = 'none';
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      isDrag = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      unlockToFreeMove();
      dragSX = e.clientX - viewX;
      dragSY = e.clientY - viewY;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrag || isLocked) return;
      viewX = e.clientX - dragSX;
      viewY = e.clientY - dragSY;
    });

    canvas.addEventListener('pointerup', (e) => {
      const movedDist = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);
      isDrag = false;

      // 단순 탭(클릭)인 경우 버스 마커 선택 검사
      if (movedDist < 7) {
        const mapClick = screenToMap(e.clientX, e.clientY);
        let clickedBus = null;
        let minBusDist = 28 / viewScale;

        for (const bus of buses.values()) {
          const bMap = worldToMap(bus.curX, bus.curZ);
          const d = Math.hypot(mapClick.x - bMap.x, mapClick.y - bMap.y);
          if (d < minBusDist) {
            minBusDist = d;
            clickedBus = bus;
          }
        }

        if (clickedBus) {
          openReservationSheet(clickedBus.id);
        }
      }
    });

    // 모바일 멀티터치 핀치 줌
    canvas.addEventListener('touchstart', (e) => {
      for (const t of e.changedTouches) {
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }
      if (activeTouches.size === 2) {
        const pts = [...activeTouches.values()];
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        pinchStartScale = viewScale;
        isDrag = false;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }

      if (activeTouches.size === 2) {
        const pts = [...activeTouches.values()];
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        viewScale = Math.min(Math.max(pinchStartScale * (dist / pinchStartDist), 0.2), 8.0);
      } else if (activeTouches.size === 1 && !isLocked) {
        const [pt] = activeTouches.values();
        viewX = pt.x - dragSX;
        viewY = pt.y - dragSY;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      for (const t of e.changedTouches) {
        activeTouches.delete(t.identifier);
      }
    }, { passive: true });

    // 마우스 휠 줌
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      unlockToFreeMove();
      const factor = e.deltaY < 0 ? 1.15 : 0.85;
      viewScale = Math.min(Math.max(viewScale * factor, 0.2), 8.0);
    }, { passive: false });

    // 줌 버튼
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      viewScale = Math.min(viewScale * 1.3, 8.0);
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      viewScale = Math.max(viewScale * 0.75, 0.2);
    });

    // ==========================================
    // 9. 하차 예약 및 자동 하차벨 웹 연동
    // ==========================================
    let selectedBusId = null;
    let currentReservations = {};
    let bellAlertTimer = null;

    try {
      db.ref('radar/reservations').on('value', (snap) => {
        currentReservations = snap.val() || {};
        renderReservationSheet();
        checkTriggeredReservations();
      });
    } catch (e) {}

    function openReservationSheet(busId) {
      selectedBusId = busId;
      const sheet = document.getElementById('reservationSheet');
      if (sheet) sheet.classList.add('active');
      renderReservationSheet();
    }

    function closeReservationSheet() {
      selectedBusId = null;
      const sheet = document.getElementById('reservationSheet');
      if (sheet) sheet.classList.remove('active');
    }

    function renderReservationSheet() {
      if (!selectedBusId) return;
      const bus = buses.get(selectedBusId);
      if (!bus) {
        closeReservationSheet();
        return;
      }

      const routeBadge = document.getElementById('sheetRouteBadge');
      const floorBadge = document.getElementById('sheetFloorBadge');
      const bellBadge = document.getElementById('sheetBellBadge');
      const currentStopEl = document.getElementById('sheetCurrentStop');
      const stopListEl = document.getElementById('sheetStopList');

      if (routeBadge) routeBadge.textContent = bus.route || bus.name || 'BUS';
      if (floorBadge) {
        floorBadge.textContent = bus.isHighFloor ? '고상' : '저상';
        floorBadge.className = 'bus-floor-badge ' + (bus.isHighFloor ? 'badge-high' : 'badge-low');
      }
      if (bellBadge) {
        bellBadge.style.display = bus.isBellRinging ? 'inline-block' : 'none';
      }
      if (currentStopEl) {
        currentStopEl.textContent = bus.currentStop ? `${bus.currentStop.name} (정류장 접근/정차 중)` : '운행 중 (다음 정류장 이동)';
      }

      const busKey = bus.id.replace(/[.#$/[\]]/g, '_');
      const currentRes = currentReservations[busKey];

      if (!stopListEl) return;
      stopListEl.innerHTML = '';

      const upcoming = bus.upcomingStops || [];
      if (upcoming.length === 0) {
        stopListEl.innerHTML = '<div style="color: #94a3b8; font-size: 13px; padding: 18px 0; text-align: center;">남은 정류장이 없습니다 (종점 도착 또는 노선 종료)</div>';
        return;
      }

      upcoming.forEach((stop) => {
        const isThisReserved = currentRes && Number(currentRes.targetStopIndex) === Number(stop.index);
        const item = document.createElement('div');
        item.className = 'stop-item' + (isThisReserved ? ' reserved' : '');

        item.innerHTML = `
          <div class="stop-left">
            <div class="stop-index-circle">${stop.index}</div>
            <div>
              <div class="stop-name">${stop.name || ('정류장 ' + stop.index)}</div>
              <div class="stop-dist">${stop.distance ? Math.round(stop.distance) + 'm 남음' : ''}</div>
            </div>
          </div>
          <div>
            ${isThisReserved
              ? `<button class="btn-reserved" onclick="cancelReservation('${bus.id}')">🔔 예약됨 (취소)</button>`
              : `<button class="btn-reserve" onclick="reserveStop('${bus.id}', ${stop.index}, '${(stop.name || ('정류장 ' + stop.index)).replace(/'/g, "\\'")}')">하차 예약</button>`
            }
          </div>
        `;
        stopListEl.appendChild(item);
      });
    }

    function reserveStop(busId, stopIndex, stopName) {
      const bus = buses.get(busId);
      if (!bus) return;
      const busKey = bus.id.replace(/[.#$/[\]]/g, '_');
      db.ref('radar/reservations/' + busKey).set({
        busId: bus.id,
        route: bus.route,
        targetStopIndex: stopIndex,
        targetStopName: stopName,
        status: 'pending',
        reservedAt: Date.now()
      });
      showToast(`🔔 ${stopName} 하차 예약이 완료되었습니다!`);
      renderReservationSheet();
    }

    function cancelReservation(busId) {
      const busKey = busId.replace(/[.#$/[\]]/g, '_');
      db.ref('radar/reservations/' + busKey).remove();
      showToast('하차 예약을 취소했습니다.');
      renderReservationSheet();
    }

    function playWebBellChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;

        // G5 (784Hz)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(784, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.45);

        // E5 (659Hz)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(659, now + 0.35);
        gain2.gain.setValueAtTime(0.3, now + 0.35);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.35);
        osc2.stop(now + 0.9);
      } catch (e) {}
    }

    function showBellAlert(msg) {
      const banner = document.getElementById('bellAlertBanner');
      if (!banner) return;
      banner.textContent = msg;
      banner.classList.add('show');
      clearTimeout(bellAlertTimer);
      bellAlertTimer = setTimeout(() => {
        banner.classList.remove('show');
      }, 4500);
    }

    const notifiedReservationKeys = new Set();
    function checkTriggeredReservations() {
      for (const [key, res] of Object.entries(currentReservations)) {
        if (res && res.status === 'triggered' && !notifiedReservationKeys.has(key)) {
          notifiedReservationKeys.add(key);
          playWebBellChime();
          if (navigator.vibrate) navigator.vibrate([250, 150, 250]);
          showBellAlert(`🔔 하차벨 자동 작동!\n이번 정류장 [${res.targetStopName || '예약 정류장'}]에서 하차하세요.`);
        }
      }
    }
  </script>
</body>
