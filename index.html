<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bomati GPS Radar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0b0f19;
      overflow: hidden;
      display: block;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 기기 화면에 맞춘 전체화면 반응형 뷰포트 */
    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0b0f19;
    }

    #mapCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Firebase 연결 상태를 숨기지 않고 화면에 표시해 문제를 바로 확인합니다. */
    .firebase-status {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: calc(12px + env(safe-area-inset-left, 0px));
      z-index: 25;
      max-width: calc(100vw - 24px);
      padding: 7px 11px;
      border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.86);
      color: #fde68a;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      transition: color 0.2s, border-color 0.2s;
    }

    .firebase-status.ok {
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.45);
    }

    .firebase-status.error {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.5);
    }

    /* 우측 하단 플로팅 컨트롤 (모바일 Safe Area 반영) */
    .controls-fab {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      right: calc(18px + env(safe-area-inset-right, 0px));
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .btn-fab {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
      font-size: 19px;
      font-weight: bold;
    }

    .btn-fab:active {
      transform: scale(0.92);
    }

    .btn-fab svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* 과녁(GPS 추적) 버튼 */
    #lockBtn {
      border-color: rgba(56, 189, 248, 0.4);
    }

    #lockBtn.active {
      background: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6), 0 4px 14px rgba(0, 0, 0, 0.4);
      color: #fff;
    }

    /* 자유 이동 안내 토스트 (모바일 Safe Area 반영) */
    .toast {
      position: absolute;
      bottom: calc(82px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 18px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      z-index: 25;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }

    /* 하차 예약 바텀 시트 (모바일 최적화) */
    .reservation-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 70%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1.5px solid rgba(255, 255, 255, 0.15);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }

    .reservation-sheet.active {
      transform: translateY(0);
    }

    .sheet-header {
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sheet-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bus-route-badge {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      padding: 3px 9px;
      border-radius: 6px;
      background: #0284c7;
    }

    .bus-floor-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.2s, filter 0.15s;
    }
    .bus-floor-badge:hover {
      transform: scale(1.08);
      filter: brightness(1.15);
    }
    .bus-floor-badge:active {
      transform: scale(0.95);
    }
    .badge-low { background: #16a34a; }
    .badge-high { background: #ea580c; }

    .bell-status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      background: #e11d48;
      color: #fff;
      animation: pulseBell 1s infinite;
    }
    @keyframes pulseBell {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    .btn-close-sheet {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .sheet-body {
      padding: 12px 18px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .current-stop-info {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .current-stop-name {
      color: #38bdf8;
      font-weight: 600;
    }

    .stop-list-title {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    .stop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      margin-bottom: 7px;
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      transition: background 0.2s;
    }
    .stop-item.reserved {
      background: rgba(2, 132, 199, 0.2);
      border-color: #38bdf8;
    }

    .stop-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stop-index-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stop-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .stop-dist {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .btn-reserve {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reserve:active { transform: scale(0.95); }

    .btn-reserved {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 근처 버스 알림 플로팅 버튼 */
    .nearby-bus-pill {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 24px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      z-index: 25;
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
      transition: all 0.25s;
    }

    /* 하차벨 자동 알림 팝업 배너 */
    .bell-alert-banner {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(-150%);
      background: linear-gradient(135deg, #e11d48, #be123c);
      border: 1.5px solid #fda4af;
      border-radius: 14px;
      padding: 12px 20px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      z-index: 50;
      box-shadow: 0 8px 25px rgba(225, 29, 72, 0.5);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: pre-line;
      pointer-events: none;
    }
    .bell-alert-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    /* APK/WebView용 데모 로그인과 계정 전환 UI */
    .demo-login {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.28), rgba(2, 6, 23, 0.94));
    }
    .demo-login.hidden { display: none; }
    .demo-login-card {
      width: min(100%, 420px);
      padding: 24px 20px 20px;
      border: 1px solid rgba(125, 211, 252, 0.35);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.98);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
    }
    .demo-login-eyebrow { color: #7dd3fc; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .demo-login-title { margin: 7px 0 6px; font-size: 23px; line-height: 1.2; }
    .demo-login-copy { color: #cbd5e1; font-size: 13px; line-height: 1.55; }
    .login-form { display: grid; gap: 11px; margin-top: 18px; }
    .login-field { display: grid; gap: 6px; color: #cbd5e1; font-size: 12px; font-weight: 700; }
    .login-input {
      width: 100%; min-height: 46px; padding: 0 12px; border: 1px solid rgba(148, 163, 184, .32);
      border-radius: 11px; background: #0f172a; color: #f8fafc; font-size: 15px; outline: none;
    }
    .login-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, .15); }
    .login-accessibility { display: flex; align-items: center; gap: 7px; color: #bae6fd; font-size: 12px; cursor: pointer; }
    .login-accessibility input { accent-color: #38bdf8; }
    .login-submit {
      min-height: 48px; border: 0; border-radius: 12px; background: #0284c7; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .login-error { min-height: 16px; color: #fda4af; font-size: 12px; }
    .demo-profile-list { display: grid; gap: 10px; margin-top: 18px; }
    .demo-profile-btn {
      width: 100%; min-height: 64px; padding: 11px 13px; border: 1px solid rgba(148, 163, 184, .28);
      border-radius: 14px; background: rgba(30, 41, 59, .9); color: #fff; text-align: left; cursor: pointer;
    }
    .demo-profile-btn:active { transform: scale(.98); }
    .demo-profile-btn.mobility { border-color: rgba(56, 189, 248, .7); background: rgba(3, 105, 161, .27); }
    .demo-profile-name { display: block; font-size: 15px; font-weight: 800; }
    .demo-profile-detail { display: block; margin-top: 3px; color: #cbd5e1; font-size: 12px; }
    .demo-login-note { margin-top: 14px; color: #94a3b8; font-size: 11px; line-height: 1.45; }
    .demo-account-btn {
      position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(58px + env(safe-area-inset-top, 0px));
      z-index: 26; max-width: 170px; padding: 7px 10px; border: 1px solid rgba(125, 211, 252, .4);
      border-radius: 12px; background: rgba(15, 23, 42, .9); color: #e0f2fe; font-size: 11px; font-weight: 700;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
    }
    .account-menu {
      position: absolute; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(98px + env(safe-area-inset-top, 0px));
      z-index: 27; width: 190px; padding: 10px; border: 1px solid rgba(125, 211, 252, .35); border-radius: 13px;
      background: rgba(15, 23, 42, .98); box-shadow: 0 12px 28px rgba(0,0,0,.4);
    }
    .account-menu.hidden { display: none; }
    .account-menu-name { padding: 4px 3px 10px; color: #cbd5e1; font-size: 12px; }
    .account-logout { width: 100%; min-height: 38px; border: 1px solid rgba(248, 113, 113, .45); border-radius: 9px; background: rgba(127, 29, 29, .25); color: #fecaca; font-size: 13px; font-weight: 700; cursor: pointer; }

    @media (max-width: 480px) {
      .firebase-status { max-width: calc(100vw - 24px); font-size: 10px; }
      .nearby-bus-pill { top: calc(90px + env(safe-area-inset-top, 0px)); max-width: calc(100vw - 28px); padding: 7px 11px; }
      .controls-fab { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
      .btn-fab { width: 48px; height: 48px; }
      .reservation-sheet { max-height: min(78dvh, 620px); }
      .sheet-header { padding: 12px 14px 9px; }
      .sheet-title-group { gap: 5px; flex-wrap: wrap; }
      .sheet-body { padding: 11px 14px; }
      .stop-item { padding: 10px; }
      .demo-login { padding-inline: 12px; }
    }
  </style>

  <!-- 웹뷰(APK) 및 file:// 호환 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="viewport">
    <canvas id="mapCanvas"></canvas>
    <div id="firebaseStatus" class="firebase-status">Firebase 연결 확인 중...</div>
    <button id="demoAccountBtn" class="demo-account-btn" type="button" style="display:none;"></button>
    <div id="accountMenu" class="account-menu hidden">
      <div id="accountMenuName" class="account-menu-name"></div>
      <button id="logoutBtn" class="account-logout" type="button">로그아웃</button>
    </div>

    <!-- 근처 버스 알림 플로팅 버튼 -->
    <div id="nearbyBusPill" class="nearby-bus-pill" style="display: none;"></div>

    <!-- 하차벨 자동 알림 배너 -->
    <div id="bellAlertBanner" class="bell-alert-banner"></div>

    <!-- 우측 하단 컨트롤 -->
    <div class="controls-fab">
      <button id="zoomInBtn" class="btn-fab" title="확대">+</button>
      <button id="zoomOutBtn" class="btn-fab" title="축소">−</button>
      <!-- 과녁(내 위치 추적 고정) 버튼 -->
      <button id="lockBtn" class="btn-fab active" title="내 위치 추적">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
          <path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
          <circle cx="12" cy="12" r="2.5"/>
        </svg>
      </button>
    </div>

    <!-- 하차 예약 바텀 시트 -->
    <div id="reservationSheet" class="reservation-sheet">
      <div class="sheet-header">
        <div class="sheet-title-group">
          <span id="sheetRouteBadge" class="bus-route-badge">BUS</span>
          <span id="sheetFloorBadge" class="bus-floor-badge badge-high" title="클릭하여 고상 / 저상 차종 수동 전환">고상</span>
          <span id="sheetBellBadge" class="bell-status-badge" style="display: none;">🔔 하차벨 울림</span>
        </div>
        <button class="btn-close-sheet" onclick="closeReservationSheet()">✕</button>
      </div>
      <div class="sheet-body">
        <div class="current-stop-info">
          현재 위치: <span id="sheetCurrentStop" class="current-stop-name">운행 중</span>
        </div>
        <div class="stop-list-title">다음 하차 가능 정류장 (남은 정류장 목록)</div>
        <div id="sheetStopList"></div>
      </div>
    </div>

    <!-- 자유 이동 모드 토스트 -->
    <div id="toast" class="toast">자유 이동 모드 (과녁 클릭 시 내 위치 복귀)</div>

    <!-- 해커톤 시연용 로컬 로그인: 실제 서버 인증·건강정보 수집 없음 -->
    <div id="demoLogin" class="demo-login" role="dialog" aria-modal="true" aria-label="로그인">
      <div class="demo-login-card">
        <div class="demo-login-eyebrow">BOMATI DEMO ACCESS</div>
        <h1 class="demo-login-title">로그인</h1>
        <p class="demo-login-copy">로그인 상태는 이 기기에 유지됩니다.</p>
        <form id="demoLoginForm" class="login-form">
          <label class="login-field">아이디
            <input id="loginUserId" class="login-input" type="text" inputmode="text" autocomplete="username" placeholder="아이디 입력" required maxlength="24">
          </label>
          <label class="login-field">비밀번호
            <input id="loginPassword" class="login-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호 입력" required maxlength="32">
          </label>
          <label class="login-accessibility"><input id="loginAccessibility" type="checkbox"> 이동지원 모드로 로그인</label>
          <div id="loginError" class="login-error" role="alert"></div>
          <button class="login-submit" type="submit">로그인</button>
        </form>
        <p class="demo-login-note">해커톤 데모 계정: <b>bomati / 1234</b> 또는 <b>mobility / 1234</b>. 실제 서버 인증·건강정보는 저장하지 않습니다.</p>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 고정 설정 & 발표용 타겟 사용자
    // ==========================================
    const FIREBASE_DB_URL = "https://bumati-default-rtdb.asia-southeast1.firebasedatabase.app";

    // Roblox의 실제 영어 사용자명(Player.Name)을 넣으세요. 표시명(DisplayName)은 사용하지 않습니다.
    // 이 계정만 지도에 표시됩니다.
    const TARGET_ROBLOX_USER_NAME = "laz3411";

    const CONFIG = {
      minX: -2838, maxX: 1108,
      minZ: 432,   maxZ: 2531,
      invertX: true,
      invertZ: true,
      invertArrowX: true
    };

    // ==========================================
    // 2. 기기 화면 맞춤 반응형 뷰포트
    // ==========================================
    const vpEl = document.getElementById('viewport');
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let vW = 0, vH = 0;

    function applyViewport() {
      // visualViewport를 우선 감지하여 모바일 주소창/하단바/가상키보드 변화에 대응
      const vw = window.visualViewport ? Math.round(window.visualViewport.width) : window.innerWidth;
      const vh = window.visualViewport ? Math.round(window.visualViewport.height) : window.innerHeight;

      vpEl.style.width = vw + 'px';
      vpEl.style.height = vh + 'px';

      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);
      canvas.style.width = vw + 'px';
      canvas.style.height = vh + 'px';

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      vW = vw;
      vH = vh;
    }

    window.addEventListener('resize', applyViewport);
    window.addEventListener('orientationchange', () => {
      setTimeout(applyViewport, 150);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', applyViewport);
    }
    applyViewport();

    // ==========================================
    // 2-1. APK용 로컬 데모 로그인 (서버 인증/개인정보 미사용)
    // ==========================================
    const DEMO_ACCOUNTS = {
      bomati: { password: '1234', name: '김보마', accessibility: false },
      mobility: { password: '1234', name: '이봄', accessibility: true }
    };
    let demoProfile = null;
    const demoLoginEl = document.getElementById('demoLogin');
    const demoAccountBtn = document.getElementById('demoAccountBtn');
    const accountMenuEl = document.getElementById('accountMenu');
    const accountMenuNameEl = document.getElementById('accountMenuName');

    function renderDemoProfile() {
      if (!demoProfile) return;
      if (demoLoginEl) demoLoginEl.classList.add('hidden');
      if (demoAccountBtn) {
        demoAccountBtn.style.display = 'block';
        demoAccountBtn.textContent = `${demoProfile.accessibility ? '♿ ' : '👤 '}${demoProfile.name}`;
      }
      if (accountMenuNameEl) accountMenuNameEl.textContent = `${demoProfile.userId} · ${demoProfile.accessibility ? '이동지원 모드' : '일반 모드'}`;
    }

    function openLogin() {
      if (accountMenuEl) accountMenuEl.classList.add('hidden');
      if (demoLoginEl) demoLoginEl.classList.remove('hidden');
      const userId = document.getElementById('loginUserId');
      if (userId) setTimeout(() => userId.focus(), 120);
    }

    function logoutDemoAccount() {
      demoProfile = null;
      try { localStorage.removeItem('bomati_demo_session'); } catch (e) {}
      if (demoAccountBtn) demoAccountBtn.style.display = 'none';
      if (accountMenuEl) accountMenuEl.classList.add('hidden');
      const loginForm = document.getElementById('demoLoginForm');
      if (loginForm) loginForm.reset();
      openLogin();
    }

    try {
      const savedSession = JSON.parse(localStorage.getItem('bomati_demo_session') || 'null');
      if (savedSession && savedSession.userId && typeof savedSession.accessibility === 'boolean') demoProfile = savedSession;
    } catch (e) {}
    if (demoProfile) renderDemoProfile();

    const loginForm = document.getElementById('demoLoginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const userId = String(document.getElementById('loginUserId').value || '').trim().toLowerCase();
        const password = String(document.getElementById('loginPassword').value || '');
        const accessibility = document.getElementById('loginAccessibility').checked;
        const errorEl = document.getElementById('loginError');
        const account = DEMO_ACCOUNTS[userId];
        if (!account || account.password !== password) {
          if (errorEl) errorEl.textContent = '아이디 또는 비밀번호를 확인하세요.';
          return;
        }
        demoProfile = {
          userId,
          name: account.name,
          accessibility: accessibility || account.accessibility
        };
        try { localStorage.setItem('bomati_demo_session', JSON.stringify(demoProfile)); } catch (e) {}
        if (errorEl) errorEl.textContent = '';
        renderDemoProfile();
        showToast(`${demoProfile.name}님, 로그인되었습니다.`);
      });
    }
    if (demoAccountBtn) {
      demoAccountBtn.addEventListener('click', () => {
        if (accountMenuEl) accountMenuEl.classList.toggle('hidden');
      });
    }
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) logoutBtn.addEventListener('click', logoutDemoAccount);

    // ==========================================
    // 3. 지도 이미지 및 내비게이션 줌
    // ==========================================
    const mapImg = new Image();
    mapImg.src = 'image/realmap.png';
    let mapLoaded = false;

    // 뷰포트 상태
    let viewX = 0, viewY = 0, viewScale = 1.0, viewRotation = 0;
    let isLocked = true; // 기본: 내 위치 및 방향 자동 추적 모드

    mapImg.onload = () => {
      mapLoaded = true;
      const currentVW = vW || window.innerWidth;
      const currentVH = vH || window.innerHeight;
      // 전체 지도가 화면에 깔끔하게 맞도록 초기 뷰 스케일 설정 (검은 여백 방지)
      const fitScale = Math.min(currentVW / mapImg.width, currentVH / mapImg.height);
      viewScale = Math.max(fitScale, 0.8);
      viewX = (currentVW - mapImg.width * viewScale) / 2;
      viewY = (currentVH - mapImg.height * viewScale) / 2;
    };

    // ==========================================
    // 4. 좌표 변환 함수
    // ==========================================
    function worldToMap(rx, rz) {
      let nx = (rx - CONFIG.minX) / (CONFIG.maxX - CONFIG.minX);
      let nz = (rz - CONFIG.minZ) / (CONFIG.maxZ - CONFIG.minZ);
      if (CONFIG.invertX) nx = 1 - nx;
      if (CONFIG.invertZ) nz = 1 - nz;
      return { x: nx * mapImg.width, y: nz * mapImg.height };
    }

    // ==========================================
    // 5. 플레이어(GPS) 및 Roblox BUS 태그 차량 데이터
    // ==========================================
    let targetPlayer = null;
    const buses = new Map();
    let globalStops = [];
    const knownStops = new Map();


    function normalizeAngle(angle) {
      if (typeof angle !== 'number' || Number.isNaN(angle)) return 0;
      while (angle > Math.PI) angle -= Math.PI * 2;
      while (angle < -Math.PI) angle += Math.PI * 2;
      return angle;
    }

    function lerpAngle(current, target, amount) {
      let diff = normalizeAngle(target - current);
      return normalizeAngle(current + diff * amount);
    }

    let latestBellInfo = null;
    const floorOverrides = new Map();
    try {
      const saved = JSON.parse(localStorage.getItem('bomati_floor_overrides') || '{}');
      for (const [k, v] of Object.entries(saved)) {
        floorOverrides.set(k, v === true);
      }
    } catch (e) {}

    function saveFloorOverride(key, isHigh) {
      if (!key) return;
      floorOverrides.set(String(key), isHigh);
      try {
        const obj = {};
        for (const [k, v] of floorOverrides) obj[k] = v;
        localStorage.setItem('bomati_floor_overrides', JSON.stringify(obj));
      } catch (e) {}
    }

    // true/false만으로는 "값이 없음"과 명시적인 저상(false)을 구분할 수 없습니다.
    // Firebase/Roblox Attribute가 문자열 또는 숫자로 직렬화되는 경우도 처리합니다.
    function parseFloorValue(val) {
      if (val === true || val === 1) return true;
      if (val === false || val === 0) return false;
      if (typeof val !== 'string') return null;

      const s = val.toLowerCase().trim();
      if (['true', 'high', '고상', '1', 'yes', 'y', 'twostep', '투스텝'].includes(s)) return true;
      if (['false', 'low', '저상', '초저상', '0', 'no', 'n', 'nonstep', '논스텝'].includes(s)) return false;
      return null;
    }

    function isBusHighFloor(rawBus) {
      if (!rawBus) return false;
      const id = String(rawBus.id || rawBus.name || '');
      const busName = String(rawBus.name || '');

      // 1. 사용자 직접 토글 오버라이드 최우선 적용
      if (floorOverrides.has(id)) return floorOverrides.get(id);
      if (busName && floorOverrides.has(busName)) return floorOverrides.get(busName);

      // 2. 하차벨 노드(/bell/latest 또는 radar.bell)에서 고상으로 판별된 경우
      if (latestBellInfo && latestBellInfo.active !== false) {
        const isBellHigh = latestBellInfo.isHighFloor === true || latestBellInfo.mode === 'high';
        if (isBellHigh) {
          const bellBusId = String(latestBellInfo.busId || latestBellInfo.busName || '');
          if (!bellBusId || bellBusId === id || bellBusId === busName || buses.size <= 1) {
            return true;
          }
        }
      }

      // 3. 전송된 명시적 차종값이 이름 키워드보다 항상 우선합니다.
      // 예: 이름에 "High"가 들어 있어도 isHighFloor: false면 저상입니다.
      const explicitHighFloor = parseFloorValue(rawBus.isHighFloor);
      if (explicitHighFloor !== null) return explicitHighFloor;

      const explicitFloorType = parseFloorValue(rawBus.floorType);
      if (explicitFloorType !== null) return explicitFloorType;

      // 4. 버스 이름 또는 ID에 고상 키워드(유니버스, 그랜버드, 고상 등)가 포함된 경우
      const nameLower = (busName + ' ' + id).toLowerCase();
      const highKeywords = ['고상', 'high', 'universe', '유니버스', 'granbird', '그랜버드', 'aerospace', '에어로스페이스', 'fx116', 'fx120', 'fx212', 'bh090', 'bh115', 'bh116', 'bh120', 'bx212', '투스텝', 'twostep'];
      const lowKeywords = ['저상', 'low', '초저상', 'nonstep'];
      const hasLow = lowKeywords.some(k => nameLower.includes(k));
      if (!hasLow && highKeywords.some(k => nameLower.includes(k))) {
        return true;
      }

      return false;
    }

    function upsertBus(rawBus) {
      if (!rawBus || !Number.isFinite(Number(rawBus.x)) || !Number.isFinite(Number(rawBus.z))) return;

      const id = String(rawBus.id || rawBus.name || `${rawBus.x},${rawBus.z}`);
      const nextAngle = normalizeAngle(rawBus.angle || 0);
      const isHigh = isBusHighFloor(rawBus);
      const existing = buses.get(id);

      if (!existing) {
        buses.set(id, {
          id,
          name: rawBus.name || '',
          route: rawBus.route || '',
          isHighFloor: isHigh,
          curX: Number(rawBus.x),
          curZ: Number(rawBus.z),
          curAngle: nextAngle,
          targetX: Number(rawBus.x),
          targetZ: Number(rawBus.z),
          targetAngle: nextAngle,
          currentStop: rawBus.currentStop || null,
          upcomingStops: rawBus.upcomingStops || [],
          allStops: rawBus.allStops || [],
          isBellRinging: rawBus.isBellRinging === true,
          lastSeen: Date.now()
        });
        return;
      }

      existing.name = rawBus.name || existing.name;
      existing.route = rawBus.route || existing.route;
      existing.isHighFloor = isHigh;
      existing.targetX = Number(rawBus.x);
      existing.targetZ = Number(rawBus.z);
      existing.targetAngle = nextAngle;
      existing.currentStop = rawBus.currentStop || existing.currentStop;
      existing.upcomingStops = rawBus.upcomingStops || existing.upcomingStops;
      existing.allStops = rawBus.allStops || existing.allStops;
      existing.isBellRinging = rawBus.isBellRinging === true;
      existing.lastSeen = Date.now();

      if (selectedBusId === id) {
        renderReservationSheet();
      }
    }

    function replaceBuses(rawBuses) {
      const liveIds = new Set();
      (rawBuses || []).forEach((bus) => {
        const id = String(bus.id || bus.name || `${bus.x},${bus.z}`);
        liveIds.add(id);
        upsertBus(bus);
      });

      for (const [id, bus] of buses) {
        if (!liveIds.has(id) || Date.now() - bus.lastSeen > 15000) {
          buses.delete(id);
        }
      }

      // 플레이어가 아직 없고 초기 뷰 포커스가 안 된 상태에서 버스가 있으면 첫 번째 버스를 화면 중앙에 맞춤
      if (!targetPlayer && !isInitialCameraFocused && buses.size > 0 && mapLoaded) {
        const firstBus = buses.values().next().value;
        if (firstBus) {
          const { x: bx, y: by } = worldToMap(firstBus.curX, firstBus.curZ);
          viewX = vW / 2 - bx * viewScale;
          viewY = vH / 2 - by * viewScale;
        }
      }
    }

    // ==========================================
    // 6. 60FPS 내비게이션 렌더링 루프
    // ==========================================
    let pulse = 0;

    function render() {
      requestAnimationFrame(render);

      const cw = vW, ch = vH;
      ctx.clearRect(0, 0, cw, ch);

      if (!mapLoaded) return;

      pulse += 0.05;

      if (targetPlayer) {
        // 10초 이상 데이터가 안 들어오면 유령 마커 제거 및 대기 상태 전환
        if (targetPlayer.lastSeen && (Date.now() - targetPlayer.lastSeen > 10000)) {
          targetPlayer = null;
        } else {
          // 부드러운 위치/각도 보간 (Lerp)
          targetPlayer.curX += (targetPlayer.targetX - targetPlayer.curX) * 0.22;
          targetPlayer.curZ += (targetPlayer.targetZ - targetPlayer.curZ) * 0.22;
          targetPlayer.curAngle = lerpAngle(targetPlayer.curAngle, targetPlayer.targetAngle, 0.22);
        }
      }

      for (const bus of buses.values()) {
        bus.curX += (bus.targetX - bus.curX) * 0.2;
        bus.curZ += (bus.targetZ - bus.curZ) * 0.2;
        bus.curAngle = lerpAngle(bus.curAngle, bus.targetAngle, 0.2);
      }

      ctx.save();

      // [잠금 모드]: 플레이어가 화면 정중앙, 플레이어 진행 방향이 항상 화면 위쪽
      if (isLocked && targetPlayer) {
        const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);

        // 진행 방향 각도 보정
        let targetRotation = CONFIG.invertArrowX ? -targetPlayer.curAngle : targetPlayer.curAngle;
        targetRotation = targetRotation + Math.PI;

        // 최단 회전 보간
        let diff = targetRotation - viewRotation;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        viewRotation += diff * 0.12;

        // 화면 중심(약간 아래쪽 60% 지점 - 자동차 내비게이션처럼 앞 시야 확보)
        const centerScreenY = ch * 0.58;

        ctx.translate(cw / 2, centerScreenY);
        ctx.rotate(-viewRotation);
        ctx.scale(viewScale, viewScale);
        ctx.translate(-px, -py);

        // 지도 렌더링
        ctx.drawImage(mapImg, 0, 0);

        drawStopMarkers(ctx);
        drawBusMarkers(ctx);

        // GPS 마커 렌더링
        drawGpsMarker(ctx, px, py, targetPlayer.curAngle);
        ctx.restore();

      } else {
        // [자유 이동 모드]: 정방향 자유 탐색
        ctx.translate(viewX, viewY);
        ctx.scale(viewScale, viewScale);

        ctx.drawImage(mapImg, 0, 0);

        drawStopMarkers(ctx);
        drawBusMarkers(ctx);

        if (targetPlayer) {
          const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);
          drawGpsMarker(ctx, px, py, targetPlayer.curAngle);
        }

        ctx.restore();
      }

      updateNearbyBusNotification();
    }

    function drawStopMarkers(ctx) {
      const renderedStopKeys = new Set();
      const allStopsToDraw = [];

      const stopKey = (stop) => {
        const id = stop && (stop.stopId ?? stop.stopID ?? stop.stationId ?? stop.stationID);
        return id !== undefined && id !== null && String(id).trim() !== ''
          ? `id:${String(id).trim()}`
          : `pos:${Math.round(Number(stop.x) * 10) / 10},${Math.round(Number(stop.z) * 10) / 10}`;
      };
      const reservationMatchesStop = (reservation, stop) => {
        if (!reservation || !stop) return false;
        const reservedId = reservation.targetStopId;
        if (reservedId !== undefined && reservedId !== null && String(reservedId) !== '') {
          const id = stop.stopId ?? stop.stopID ?? stop.stationId ?? stop.stationID;
          return id !== undefined && id !== null && String(id) === String(reservedId);
        }
        // targetStopId가 없는 기존 Firebase 예약은 이전 순번 방식으로 호환합니다.
        return Number(reservation.targetStopIndex) === Number(stop.index);
      };

      // 1. Firebase에서 수집된 전역 정류장 목록
      if (globalStops && globalStops.length > 0) {
        allStopsToDraw.push(...globalStops);
      }

      // 2. 각 버스의 allStops / upcomingStops
      for (const bus of buses.values()) {
        const stops = (bus.allStops && bus.allStops.length > 0) ? bus.allStops : (bus.upcomingStops || []);
        allStopsToDraw.push(...stops);
      }

      allStopsToDraw.forEach((stop) => {
        if (!stop || stop.x === undefined || stop.z === undefined) return;
        const key = stopKey(stop);
        if (renderedStopKeys.has(key)) return;
        renderedStopKeys.add(key);

        const { x: px, y: py } = worldToMap(stop.x, stop.z);

        // 예약 여부 확인
        let isReserved = false;
        for (const [busKey, res] of Object.entries(currentReservations)) {
          if (reservationMatchesStop(res, stop)) {
            isReserved = true;
            break;
          }
        }

        ctx.save();
        ctx.translate(px, py);

        if (isReserved) {
          // 예약된 정류장 황금빛 펄스 링
          const pulseR = 14 + Math.sin(pulse * 2) * 4;
          ctx.beginPath();
          ctx.arc(0, 0, pulseR / viewScale, 0, Math.PI * 2);
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2.5 / viewScale;
          ctx.stroke();

          ctx.fillStyle = 'rgba(251, 191, 36, 0.3)';
          ctx.fill();
        }

        // 정류장 핀 (외곽 그림자 + 원형 핀)
        const pinRadius = Math.max(5.5 / viewScale, 3.8);
        ctx.beginPath();
        ctx.arc(0, 0, pinRadius, 0, Math.PI * 2);
        ctx.fillStyle = isReserved ? '#fbbf24' : '#0284c7';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(1.5 / viewScale, 1.0);
        ctx.fill();
        ctx.stroke();

        // 중앙 화이트 도트
        ctx.beginPath();
        ctx.arc(0, 0, pinRadius * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        // 정류장 이름 또는 번호 라벨 (선명한 외곽선)
        const fontSize = Math.max(7.5 / viewScale, 4.5);
        ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.lineWidth = Math.max(2.6 / viewScale, 1.6);
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.92)';
        ctx.fillStyle = isReserved ? '#fef08a' : '#f8fafc';
        const label = isReserved ? `🔔 ${stop.name || stop.stopId || stop.index}` : String(stop.name || stop.stopId || stop.index || '정류장');
        ctx.strokeText(label, 0, -pinRadius - (2 / viewScale));
        ctx.fillText(label, 0, -pinRadius - (2 / viewScale));

        ctx.restore();
      });
    }

    function drawBusMarkers(ctx) {
      for (const bus of buses.values()) {
        const { x, y } = worldToMap(bus.curX, bus.curZ);
        drawBusMarker(ctx, x, y, bus.curAngle, bus);
      }
    }

    function drawBusMarker(ctx, px, py, angle, bus) {
      // 기존 대비 약 1.5배 축소
      const width = 10;
      const height = 24;
      const routeText = String(bus.route || bus.name || 'BUS').slice(0, 8);
      const floorText = bus.isHighFloor ? '고상' : '저상';
      const fill = bus.isHighFloor ? '#f97316' : '#16a34a';
      const isSelected = bus.id === selectedBusId;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(CONFIG.invertArrowX ? -angle : angle);

      // 선택된 버스일 경우 외곽 하이라이트 링
      if (isSelected) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.2 / viewScale;
        roundRect(ctx, -width / 2 - 2, -height / 2 - 2, width + 4, height + 4, 3);
        ctx.stroke();
      }

      // 진행 방향을 길쭉한 차체와 앞쪽 흰 선으로 표현합니다.
      ctx.fillStyle = 'rgba(15, 23, 42, 0.42)';
      ctx.fillRect(-width / 2 + 1.1, -height / 2 + 1.2, width, height);

      ctx.fillStyle = fill;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.1 / viewScale;
      roundRect(ctx, -width / 2, -height / 2, width, height, 1.8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-width / 2 + 1.5, -height / 2 + 1.8, width - 3, 2);

      ctx.font = `${Math.max(5.5 / viewScale, 3.5)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 1.4 / viewScale;
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.78)';
      ctx.fillStyle = '#ffffff';
      ctx.save();
      ctx.rotate(-Math.PI / 2);
      ctx.strokeText(routeText, 0, 1);
      ctx.fillText(routeText, 0, 1);
      ctx.restore();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.moveTo(0, -height / 2 - 4.7);
      ctx.lineTo(3.5, -height / 2 - 0.7);
      ctx.lineTo(-3.5, -height / 2 - 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.font = `${Math.max(5 / viewScale, 3.5)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 1.6 / viewScale;
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillStyle = '#ffffff';
      ctx.strokeText(floorText, px, py + 8 / viewScale);
      ctx.fillText(floorText, px, py + 8 / viewScale);

      // 하차벨 작동 중일 때 머리 위에 깜빡이는 🔔 표시
      if (bus.isBellRinging) {
        ctx.font = `${Math.max(8 / viewScale, 5)}px -apple-system, sans-serif`;
        ctx.fillText('🔔', px, py - 16 / viewScale);
      }

      ctx.restore();
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // 세련된 모바일 GPS 내비게이션 위치 마커 (크기 축소 & 닉네임 미표시)
    function drawGpsMarker(ctx, px, py, angle) {
      // 기존 대비 약 2배 축소
      const pulseR = 4 + Math.sin(pulse) * 1.5;

      // 1. 외곽 은은한 펄스 링 (내비게이션 GPS 느낌)
      ctx.beginPath();
      ctx.arc(px, py, pulseR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.lineWidth = 1.2 / viewScale;
      ctx.stroke();

      // 2. 방향 표시 삼각형 화살표 (축소된 크기)
      if (typeof angle === 'number') {
        ctx.save();
        ctx.translate(px, py);
        let ang = CONFIG.invertArrowX ? -angle : angle;
        ctx.rotate(ang);

        // 내비게이션 화살표 헤드
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.moveTo(0, -4.75);
        ctx.lineTo(2.1, -1.6);
        ctx.lineTo(-2.1, -1.6);
        ctx.closePath();
        ctx.fill();

        // 화살표 테두리
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.8 / viewScale;
        ctx.stroke();
        ctx.restore();
      }

      // 3. 중심 GPS 원형 닷 (반지름 3.5px)
      ctx.beginPath();
      ctx.arc(px, py, 1.75, 0, Math.PI * 2);
      ctx.fillStyle = '#0284c7';
      ctx.fill();
      ctx.lineWidth = 1.2 / viewScale;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    requestAnimationFrame(render);

    // ==========================================
    // 7. Firebase 실시간 데이터 수신
    // ==========================================
    let isInitialCameraFocused = false;
    // Firebase 인스턴스는 아래 하차 예약 영역에서도 사용하므로
    // try 블록 밖에 선언해야 합니다. (기존에는 블록 안 const라서
    // 예약 코드에서 항상 ReferenceError가 발생했습니다.)
    let db = null;
    const firebaseStatus = document.getElementById('firebaseStatus');
    const lockBtn = document.getElementById('lockBtn');
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function setFirebaseStatus(message, state) {
      if (!firebaseStatus) return;
      firebaseStatus.textContent = message;
      firebaseStatus.className = 'firebase-status' + (state ? ` ${state}` : '');
    }

    try {
      firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
      db = firebase.database();
      setFirebaseStatus('Firebase 연결 대기 중...', '');

      db.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
          setFirebaseStatus('Firebase 연결됨 · 위치 수신 대기 중', 'ok');
        } else {
          setFirebaseStatus('Firebase 재연결 중...', '');
        }
      });

      function normalizeList(value) {
        if (!value) return [];
        return Array.isArray(value) ? value.filter(Boolean) : Object.values(value).filter(Boolean);
      }

      // Firebase 배열/객체와 위치 객체(position, Position, pos) 형식을 모두 지도 좌표로 통일합니다.
      // 서버가 정류장 목록을 부분 갱신하는 동안에도 잘못된 항목 하나가 전체 표시를 막지 않습니다.
      function normalizeStops(value) {
        return normalizeList(value).map((raw) => {
          if (!raw || typeof raw !== 'object') return null;
          const position = raw.position || raw.Position || raw.pos || {};
          const x = raw.x !== undefined ? raw.x : (raw.X !== undefined ? raw.X : position.x ?? position.X);
          const z = raw.z !== undefined ? raw.z : (raw.Z !== undefined ? raw.Z : position.z ?? position.Z);
          if (!Number.isFinite(Number(x)) || !Number.isFinite(Number(z))) return null;
          return Object.assign({}, raw, { x: Number(x), z: Number(z) });
        }).filter(Boolean);
      }

      // Firebase PATCH 중 빈 stops가 잠깐 도착해도 이미 인식한 정류장 핀이 사라지지 않게 유지합니다.
      // 좌표가 바뀐 같은 StopId는 최신 위치/이름으로 갱신하고, 90초 이상 미수신 항목만 정리합니다.
      function rememberStops(stops) {
        const now = Date.now();
        for (const stop of stops) {
          const id = stop.stopId ?? stop.stopID ?? stop.stationId ?? stop.stationID;
          const key = id !== undefined && id !== null && String(id).trim() !== ''
            ? `id:${String(id).trim()}`
            : `pos:${Math.round(stop.x * 10) / 10},${Math.round(stop.z * 10) / 10}`;
          knownStops.set(key, Object.assign({}, stop, { _lastSeen: now }));
        }
        for (const [key, stop] of knownStops) {
          if (now - stop._lastSeen > 90000) knownStops.delete(key);
        }
        globalStops = Array.from(knownStops.values());
      }

      function updateTargetPlayer(players) {
        const list = normalizeList(players).filter(p =>
          p && typeof p === 'object' &&
          Number.isFinite(Number(p.x)) &&
          Number.isFinite(Number(p.z))
        );

        if (list.length === 0) {
          targetPlayer = null;
          return;
        }

        // TARGET_ROBLOX_USER_NAME ("laz3411")과 일치하는 플레이어 우선 탐색
        let found = list.find(p => p.name && p.name.toLowerCase() === TARGET_ROBLOX_USER_NAME.toLowerCase());
        if (!found) {
          found = list[0];
        }

        if (found) {
          const x = Number(found.x);
          const z = Number(found.z);
          const angle = Number(found.angle) || 0;

          const isFirstDetection = !targetPlayer;

          if (!targetPlayer) {
            targetPlayer = {
              id: found.id,
              name: found.name,
              curX: x, curZ: z, curAngle: angle,
              targetX: x, targetZ: z, targetAngle: angle,
              lastSeen: Date.now()
            };
          } else {
            targetPlayer.id = found.id;
            targetPlayer.name = found.name;
            targetPlayer.targetX = x;
            targetPlayer.targetZ = z;
            targetPlayer.targetAngle = angle;
            targetPlayer.lastSeen = Date.now();
          }

          if (isFirstDetection || !isInitialCameraFocused) {
            isInitialCameraFocused = true;
            isLocked = true;
            lockBtn.classList.add('active');
            showToast(`📍 [${found.name}] 위치 추적 시작`);
          }
        } else {
          targetPlayer = null;
        }
      }

      // 1) 통합 radar 노드 구독 (players, buses, bell)
      db.ref('radar').on('value', (snap) => {
        const val = snap.val();
        if (!val) {
          targetPlayer = null;
          replaceBuses([]);
          return;
        }

        // Roblox 스크립트가 PUT하는 단일 노드만 사용합니다.
        // 오래된 /players 노드와 동시에 읽으면 낡은 좌표가 새 좌표를
        // 덮어쓰는 경쟁 상태가 생길 수 있습니다.
        updateTargetPlayer(val.players || []);

        // 하차벨 및 고상 모드 동기화
        if (val.bell) {
          latestBellInfo = val.bell;
          const isBellHigh = val.bell.isHighFloor === true || val.bell.mode === 'high';
          if (isBellHigh) {
            const rawBuses = normalizeList(val.buses);
            for (const b of rawBuses) {
              if (b.id === val.bell.busId || b.name === val.bell.busName || rawBuses.length === 1) {
                b.isHighFloor = true;
                b.floorType = 'high';
              }
            }
          }
        }

        const rawBuses = normalizeList(val.buses).map((bus) => Object.assign({}, bus, {
          allStops: normalizeStops(bus && bus.allStops),
          upcomingStops: normalizeStops(bus && bus.upcomingStops)
        }));
        replaceBuses(rawBuses);

        // 이미 등록된 버스 인스턴스에도 고상 플래그 즉시 갱신
        if (latestBellInfo && (latestBellInfo.isHighFloor === true || latestBellInfo.mode === 'high')) {
          for (const bus of buses.values()) {
            if (bus.id === latestBellInfo.busId || bus.name === latestBellInfo.busName || buses.size === 1) {
              bus.isHighFloor = true;
            }
          }
        }

        rememberStops([
          ...normalizeStops(val.stops),
          ...rawBuses.flatMap((bus) => [...(bus.allStops || []), ...(bus.upcomingStops || [])])
        ]);
        const stopCount = (globalStops && globalStops.length > 0) ? ` · 정류장 ${globalStops.length}곳` : '';
        setFirebaseStatus(
          `Firebase 연결됨 · 플레이어 ${normalizeList(val.players).length}명 · 버스 ${normalizeList(val.buses).length}대${stopCount}`,
          'ok'
        );
      }, (error) => {
        console.error('[Firebase] /radar 읽기 실패:', error);
        setFirebaseStatus('Firebase 읽기 실패 · 규칙/URL 확인 필요', 'error');
        showToast('Firebase 읽기 실패: 데이터베이스 규칙과 URL을 확인하세요.');
      });

      // 2) /bell/latest 실시간 동기화
      db.ref('bell/latest').on('value', (snap) => {
        const b = snap.val();
        if (b) {
          latestBellInfo = Object.assign(latestBellInfo || {}, b);
          if (b.isHighFloor === true || b.mode === 'high') {
            for (const bus of buses.values()) {
              if (b.busId === bus.id || b.busName === bus.name || buses.size === 1) {
                bus.isHighFloor = true;
                if (selectedBusId === bus.id) renderReservationSheet();
              }
            }
          }
        }
      });

      // 정류장만 별도로 구독해 위치 데이터 PATCH 타이밍과 무관하게 유지합니다.
      db.ref('radar/stops').on('value', (snap) => {
        rememberStops(normalizeStops(snap.val()));
      });

      // 3) /radar/floorOverrides 실시간 동기화 (웹에서 변경한 고상/저상 수동 설정)
      db.ref('radar/floorOverrides').on('value', (snap) => {
        const ovs = snap.val() || {};
        for (const [key, val] of Object.entries(ovs)) {
          const isHigh = (val === 'high' || val === true);
          floorOverrides.set(key, isHigh);
          for (const bus of buses.values()) {
            const busKey = bus.id.replace(/[.#$/[\]]/g, '_');
            if (busKey === key || bus.id === key || bus.name === key) {
              bus.isHighFloor = isHigh;
            }
          }
        }
        if (selectedBusId) renderReservationSheet();
      });

    } catch (e) {
      console.error("Firebase 초기화 에러:", e);
      setFirebaseStatus('Firebase 초기화 실패 · SDK/인터넷 확인 필요', 'error');
      showToast('Firebase 초기화 실패: 인터넷 연결과 SDK 로딩을 확인하세요.');
    }

    // ==========================================
    // 8. 모바일 터치 및 인터랙션 (잠금 / 자유 이동)
    // ==========================================
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function unlockToFreeMove() {
      if (isLocked) {
        if (targetPlayer) {
          const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);
          viewX = vW / 2 - px * viewScale;
          viewY = (vH * 0.58) - py * viewScale;
        }
        isLocked = false;
        viewRotation = 0;
        lockBtn.classList.remove('active');
        showToast('자유 이동 모드 (과녁 클릭 시 내 위치 복귀)');
      }
    }

    // 과녁 버튼 클릭 시: 내 위치 추적 모드로 즉시 복귀 (플레이어가 없으면 버스/정류장으로 이동)
    lockBtn.addEventListener('click', () => {
      if (targetPlayer) {
        isLocked = true;
        viewRotation = 0;
        lockBtn.classList.add('active');
        toast.classList.remove('show');
        showToast(`📍 [${targetPlayer.name}] 내 위치 추적 모드`);
      } else if (buses.size > 0) {
        const firstBus = buses.values().next().value;
        if (firstBus) {
          const { x: bx, y: by } = worldToMap(firstBus.curX, firstBus.curZ);
          viewX = vW / 2 - bx * viewScale;
          viewY = vH / 2 - by * viewScale;
          isLocked = false;
          viewRotation = 0;
          lockBtn.classList.remove('active');
          showToast(`🚌 [${firstBus.route || firstBus.name || '버스'}] 위치로 이동`);
        }
      } else {
        showToast('위치 데이터 수신 대기 중입니다.');
      }
    });

    // 드래그 & 터치 이동
    let isDrag = false;
    let dragSX = 0, dragSY = 0;
    let dragStartX = 0, dragStartY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let activeTouches = new Map();

    function screenToMap(sx, sy) {
      if (isLocked && targetPlayer) {
        const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);
        const centerScreenY = vH * 0.58;
        const dx = sx - vW / 2;
        const dy = sy - centerScreenY;
        const cos = Math.cos(viewRotation);
        const sin = Math.sin(viewRotation);
        const rx = (dx * cos - dy * sin) / viewScale;
        const ry = (dx * sin + dy * cos) / viewScale;
        return { x: px + rx, y: py + ry };
      } else {
        return { x: (sx - viewX) / viewScale, y: (sy - viewY) / viewScale };
      }
    }

    function updateNearbyBusNotification() {
      const pill = document.getElementById('nearbyBusPill');
      if (!pill) return;

      if (!targetPlayer || buses.size === 0) {
        pill.style.display = 'none';
        return;
      }

      let nearestBus = null;
      let minDistance = 250; // 약 250 studs 이내 버스 접근 감지

      for (const bus of buses.values()) {
        const d = Math.hypot(targetPlayer.curX - bus.curX, targetPlayer.curZ - bus.curZ);
        if (d < minDistance) {
          minDistance = d;
          nearestBus = bus;
        }
      }

      if (nearestBus) {
        pill.style.display = 'flex';
        pill.innerHTML = `<span>🚌 <b>${nearestBus.route || nearestBus.name || 'BUS'}</b> 버스 접근 중 (${Math.round(minDistance)}m) · <b>하차 예약</b></span>`;
        pill.onclick = () => openReservationSheet(nearestBus.id);
      } else {
        pill.style.display = 'none';
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      isDrag = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      unlockToFreeMove();
      dragSX = e.clientX - viewX;
      dragSY = e.clientY - viewY;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrag || isLocked) return;
      viewX = e.clientX - dragSX;
      viewY = e.clientY - dragSY;
    });

    canvas.addEventListener('pointerup', (e) => {
      const movedDist = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);
      isDrag = false;

      // 단순 탭(클릭)인 경우 버스 마커 선택 검사
      if (movedDist < 7) {
        const mapClick = screenToMap(e.clientX, e.clientY);
        let clickedBus = null;
        let minBusDist = 28 / viewScale;

        for (const bus of buses.values()) {
          const bMap = worldToMap(bus.curX, bus.curZ);
          const d = Math.hypot(mapClick.x - bMap.x, mapClick.y - bMap.y);
          if (d < minBusDist) {
            minBusDist = d;
            clickedBus = bus;
          }
        }

        if (clickedBus) {
          openReservationSheet(clickedBus.id);
        }
      }
    });

    // 모바일 멀티터치 핀치 줌
    canvas.addEventListener('touchstart', (e) => {
      for (const t of e.changedTouches) {
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }
      if (activeTouches.size === 2) {
        const pts = [...activeTouches.values()];
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        pinchStartScale = viewScale;
        isDrag = false;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }

      if (activeTouches.size === 2) {
        const pts = [...activeTouches.values()];
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        viewScale = Math.min(Math.max(pinchStartScale * (dist / pinchStartDist), 0.2), 8.0);
      } else if (activeTouches.size === 1 && !isLocked) {
        const [pt] = activeTouches.values();
        viewX = pt.x - dragSX;
        viewY = pt.y - dragSY;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      for (const t of e.changedTouches) {
        activeTouches.delete(t.identifier);
      }
    }, { passive: true });

    // 마우스 휠 줌
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      unlockToFreeMove();
      const factor = e.deltaY < 0 ? 1.15 : 0.85;
      viewScale = Math.min(Math.max(viewScale * factor, 0.2), 8.0);
    }, { passive: false });

    // 줌 버튼
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      viewScale = Math.min(viewScale * 1.3, 8.0);
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      viewScale = Math.max(viewScale * 0.75, 0.2);
    });

    // ==========================================
    // 9. 하차 예약 및 자동 하차벨 웹 연동
    // ==========================================
    let selectedBusId = null;
    let currentReservations = {};
    let bellAlertTimer = null;
    // Roblox 자동 하차벨 반경과 같게 유지합니다.
    const RESERVATION_MIN_DISTANCE = 65;

    try {
      if (!db) throw new Error('Firebase database is not initialized');
      db.ref('radar/reservations').on('value', (snap) => {
        currentReservations = snap.val() || {};
        renderReservationSheet();
        checkTriggeredReservations();
      }, (error) => {
        console.error('[Firebase] reservations 읽기 실패:', error);
      });
    } catch (e) {
      console.error('[Firebase] reservations 초기화 실패:', e);
    }

    function openReservationSheet(busId) {
      selectedBusId = busId;
      const sheet = document.getElementById('reservationSheet');
      if (sheet) sheet.classList.add('active');
      renderReservationSheet();
    }

    function closeReservationSheet() {
      selectedBusId = null;
      const sheet = document.getElementById('reservationSheet');
      if (sheet) sheet.classList.remove('active');
    }

    function renderReservationSheet() {
      if (!selectedBusId) return;
      const bus = buses.get(selectedBusId);
      if (!bus) {
        closeReservationSheet();
        return;
      }

      const routeBadge = document.getElementById('sheetRouteBadge');
      const floorBadge = document.getElementById('sheetFloorBadge');
      const bellBadge = document.getElementById('sheetBellBadge');
      const currentStopEl = document.getElementById('sheetCurrentStop');
      const stopListEl = document.getElementById('sheetStopList');

      if (routeBadge) routeBadge.textContent = bus.route || bus.name || 'BUS';
      if (floorBadge) {
        floorBadge.textContent = bus.isHighFloor ? '고상' : '저상';
        floorBadge.className = 'bus-floor-badge ' + (bus.isHighFloor ? 'badge-high' : 'badge-low');
        floorBadge.style.cursor = 'pointer';
        floorBadge.title = '클릭하여 고상 / 저상 차종 직접 변경';
        floorBadge.onclick = (e) => {
          e.stopPropagation();
          bus.isHighFloor = !bus.isHighFloor;
          saveFloorOverride(bus.id, bus.isHighFloor);
          if (bus.name) saveFloorOverride(bus.name, bus.isHighFloor);
          floorBadge.textContent = bus.isHighFloor ? '고상' : '저상';
          floorBadge.className = 'bus-floor-badge ' + (bus.isHighFloor ? 'badge-high' : 'badge-low');
          showToast(`🚌 [${bus.route || bus.name || '버스'}] 차종 변경: ${bus.isHighFloor ? '고상 버스 (오렌지)' : '저상 버스 (초록)'}`);
          if (db) {
            const busKey = bus.id.replace(/[.#$/[\]]/g, '_');
            db.ref(`radar/floorOverrides/${busKey}`).set(bus.isHighFloor ? 'high' : 'low').catch(() => {});
          }
        };
      }
      if (bellBadge) {
        bellBadge.style.display = bus.isBellRinging ? 'inline-block' : 'none';
      }
      if (currentStopEl) {
        currentStopEl.textContent = bus.currentStop ? `${bus.currentStop.name} (정류장 접근/정차 중)` : '운행 중 (다음 정류장 이동)';
      }

      const busKey = bus.id.replace(/[.#$/[\]]/g, '_');
      const currentRes = currentReservations[busKey];

      if (!stopListEl) return;
      stopListEl.innerHTML = '';

      let upcoming = bus.upcomingStops || [];
      if (upcoming.length === 0 && bus.allStops && bus.allStops.length > 0) {
        upcoming = bus.allStops;
      }
      // 노선 폴더의 순번 목록이 아직 오지 않아도, 지도에 수신된 정류장은 예약할 수 있게 합니다.
      // reserveStop이 좌표를 함께 저장하므로 Roblox도 노선 목록 없이 거리 기반 자동 벨을 실행할 수 있습니다.
      if (upcoming.length === 0 && globalStops.length > 0) {
        upcoming = globalStops.map((stop) => Object.assign({}, stop, {
          distance: Math.hypot(Number(stop.x) - bus.curX, Number(stop.z) - bus.curZ)
        }));
      }
      if (upcoming.length === 0) {
        if (currentRes) {
          const legacyLabel = currentRes.targetStopName || currentRes.targetStopId || currentRes.targetStopIndex || '알 수 없는 정류장';
          stopListEl.innerHTML = `
            <div style="color: #fbbf24; font-size: 13px; padding: 14px 0 8px; text-align: center;">이전 예약 데이터가 남아 있습니다: ${legacyLabel}</div>
            <div style="color: #94a3b8; font-size: 12px; padding: 0 0 12px; text-align: center;">현재 수신된 정류장 좌표와 연결되지 않은 이전 형식 데이터입니다.</div>
            <div style="text-align: center;"><button class="btn-reserved" onclick="cancelReservation('${bus.id}')">이전 예약 데이터 삭제</button></div>`;
        } else {
          stopListEl.innerHTML = '<div style="color: #94a3b8; font-size: 13px; padding: 18px 0; text-align: center;">남은 정류장이 없습니다 (노선 정류장 폴더 확인 필요)</div>';
        }
        return;
      }

      upcoming.forEach((stop) => {
        const hasStopId = stop.stopId !== undefined && stop.stopId !== null && String(stop.stopId) !== '';
        const sameStop = (a, b) => {
          if (!a || !b) return false;
          if (a.stopId !== undefined && a.stopId !== null && b.stopId !== undefined && b.stopId !== null) {
            return String(a.stopId) === String(b.stopId);
          }
          return Number(a.index) === Number(b.index);
        };
        const isCurrentOrNearby = sameStop(stop, bus.currentStop)
          || (Number.isFinite(Number(stop.distance)) && Number(stop.distance) <= RESERVATION_MIN_DISTANCE);
        const isThisReserved = currentRes && (
          hasStopId && currentRes.targetStopId !== undefined && currentRes.targetStopId !== null
            ? String(currentRes.targetStopId) === String(stop.stopId)
            : Number(currentRes.targetStopIndex) === Number(stop.index)
        );
        const item = document.createElement('div');
        item.className = 'stop-item' + (isThisReserved ? ' reserved' : '');

        item.innerHTML = `
          <div class="stop-left">
            <div class="stop-index-circle">${stop.index}</div>
            <div>
              <div class="stop-name">${stop.name || ('정류장 ' + stop.index)}</div>
              <div class="stop-dist">${isCurrentOrNearby ? '현재 정류장 또는 매우 가까움 · 예약 불가' : (Number.isFinite(Number(stop.distance)) ? Math.round(stop.distance) + 'm 남음' : '')}</div>
            </div>
          </div>
          <div>
            ${isThisReserved
              ? `<button class="btn-reserved" onclick="cancelReservation('${bus.id}')">🔔 예약됨 (취소)</button>`
              : isCurrentOrNearby
                ? `<button class="btn-reserve" disabled style="opacity:.5; cursor:not-allowed;">현재 정류장</button>`
              : `<button class="btn-reserve" onclick="reserveStop('${bus.id}', ${Number(stop.index)}, '${String(stop.stopId || '').replace(/'/g, "\\'")}', '${(stop.name || ('정류장 ' + stop.index)).replace(/'/g, "\\'")}')">하차 예약</button>`
            }
          </div>
        `;
        stopListEl.appendChild(item);
      });
    }

    function reserveStop(busId, stopIndex, stopId, stopName) {
      const bus = buses.get(busId);
      if (!bus) return;
      if (!db) {
        showToast('Firebase 연결 전입니다. 잠시 후 다시 시도하세요.');
        return;
      }
      const allStops = [...(bus.upcomingStops || []), ...(bus.allStops || []), ...globalStops];
      const selectedStop = allStops.find((stop) => {
        if (stopId && stop.stopId !== undefined && stop.stopId !== null) return String(stop.stopId) === String(stopId);
        return Number(stop.index) === Number(stopIndex);
      });

      const isCurrentStop = bus.currentStop && selectedStop && (
        bus.currentStop.stopId !== undefined && bus.currentStop.stopId !== null && selectedStop.stopId !== undefined && selectedStop.stopId !== null
          ? String(bus.currentStop.stopId) === String(selectedStop.stopId)
          : Number(bus.currentStop.index) === Number(selectedStop.index)
      );
      const isTooClose = selectedStop && Number.isFinite(Number(selectedStop.distance))
        && Number(selectedStop.distance) <= RESERVATION_MIN_DISTANCE;
      if (isCurrentStop || isTooClose) {
        showToast('현재 정류장 또는 매우 가까운 정류장은 하차 예약할 수 없습니다.');
        return;
      }
      const busKey = bus.id.replace(/[.#$/[\]]/g, '_');
      // 로그인한 이동지원 이용자는 저상버스 예약 시 자동으로 B(이동지원) 벨을 사용합니다.
      const useAccessibilityBell = !!(demoProfile && demoProfile.accessibility && !bus.isHighFloor);
      db.ref('radar/reservations/' + busKey).set({
        busId: bus.id,
        route: bus.route,
        targetStopIndex: stopIndex,
        targetStopId: stopId || null,
        targetStopName: stopName,
        // 예약 시점의 좌표를 함께 보관해 서버 노선 목록이 잠깐 비어도 자동 벨 목표를 잃지 않습니다.
        targetStopX: selectedStop ? Number(selectedStop.x) : null,
        targetStopY: selectedStop && Number.isFinite(Number(selectedStop.y)) ? Number(selectedStop.y) : null,
        targetStopZ: selectedStop ? Number(selectedStop.z) : null,
        accessibilityMode: useAccessibilityBell,
        status: 'pending',
        reservedAt: Date.now()
      }).then(() => {
        showToast(`🔔 ${stopName} 하차 예약이 완료되었습니다!`);
        renderReservationSheet();
      }).catch((error) => {
        console.error('[Firebase] 하차 예약 저장 실패:', error);
        showToast('하차 예약 저장에 실패했습니다. Firebase 연결·규칙을 확인하세요.');
      });
    }

    function cancelReservation(busId) {
      if (!db) {
        showToast('Firebase 연결 전입니다. 잠시 후 다시 시도하세요.');
        return;
      }
      const busKey = busId.replace(/[.#$/[\]]/g, '_');
      db.ref('radar/reservations/' + busKey).remove().catch((error) => {
        console.error('[Firebase] 하차 예약 취소 실패:', error);
        showToast('하차 예약 취소에 실패했습니다. Firebase 규칙을 확인하세요.');
      });
      showToast('하차 예약을 취소했습니다.');
      renderReservationSheet();
    }

    function playWebBellChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;

        // G5 (784Hz)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(784, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.45);

        // E5 (659Hz)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(659, now + 0.35);
        gain2.gain.setValueAtTime(0.3, now + 0.35);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.35);
        osc2.stop(now + 0.9);
      } catch (e) {}
    }

    function showBellAlert(msg) {
      const banner = document.getElementById('bellAlertBanner');
      if (!banner) return;
      banner.textContent = msg;
      banner.classList.add('show');
      clearTimeout(bellAlertTimer);
      bellAlertTimer = setTimeout(() => {
        banner.classList.remove('show');
      }, 4500);
    }

    const notifiedReservationKeys = new Set();
    function checkTriggeredReservations() {
      for (const [key, res] of Object.entries(currentReservations)) {
        if (res && res.status === 'triggered' && !notifiedReservationKeys.has(key)) {
          notifiedReservationKeys.add(key);
          playWebBellChime();
          if (navigator.vibrate) navigator.vibrate([250, 150, 250]);
          showBellAlert(`🔔 하차벨 자동 작동!\n이번 정류장 [${res.targetStopName || '예약 정류장'}]에서 하차하세요.`);
        }
      }
    }
  </script>
</body>
