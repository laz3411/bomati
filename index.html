<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bomati GPS Radar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 9:16 세로 모바일 전용 뷰포트 */
    #viewport {
      position: relative;
      overflow: hidden;
      background: #0b0f19;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }

    #mapCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 우측 하단 플로팅 컨트롤 */
    .controls-fab {
      position: absolute;
      bottom: 24px;
      right: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .btn-fab {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
      font-size: 19px;
      font-weight: bold;
    }

    .btn-fab:active {
      transform: scale(0.92);
    }

    .btn-fab svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* 과녁(GPS 추적) 버튼 */
    #lockBtn {
      border-color: rgba(56, 189, 248, 0.4);
    }

    #lockBtn.active {
      background: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6), 0 4px 14px rgba(0, 0, 0, 0.4);
      color: #fff;
    }

    /* 자유 이동 안내 토스트 */
    .toast {
      position: absolute;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 18px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      z-index: 25;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }
  </style>

  <!-- 웹뷰(APK) 및 file:// 호환 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="viewport">
    <canvas id="mapCanvas"></canvas>

    <!-- 우측 하단 컨트롤 -->
    <div class="controls-fab">
      <button id="zoomInBtn" class="btn-fab" title="확대">+</button>
      <button id="zoomOutBtn" class="btn-fab" title="축소">−</button>
      <!-- 과녁(내 위치 추적 고정) 버튼 -->
      <button id="lockBtn" class="btn-fab active" title="내 위치 추적">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
          <path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
          <circle cx="12" cy="12" r="2.5"/>
        </svg>
      </button>
    </div>

    <!-- 자유 이동 모드 토스트 -->
    <div id="toast" class="toast">자유 이동 모드 (과녁 클릭 시 내 위치 복귀)</div>
  </div>

  <script>
    // ==========================================
    // 1. 고정 설정 & 발표용 타겟 사용자
    // ==========================================
    const FIREBASE_DB_URL = "https://bumati-default-rtdb.asia-southeast1.firebasedatabase.app";

    // ★ 발표 눈속임용 대상 닉네임 (본인 닉네임 지정)
    // 지정된 유저만 지도에 단독으로 뜨며, 다른 사람은 아예 표시되지 않습니다.
    const TARGET_USER_NAME = "laz3411";

    const CONFIG = {
      minX: -2838, maxX: 1108,
      minZ: 432,   maxZ: 2531,
      invertX: true,
      invertZ: true,
      invertArrowX: true
    };

    // ==========================================
    // 2. 9:16 모바일 종횡비 뷰포트
    // ==========================================
    const vpEl = document.getElementById('viewport');
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let vW = 0, vH = 0;

    function applyViewport() {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      let vw, vh;

      // 9:16 비율 (세로 모바일)
      if (sw / sh > 9 / 16) {
        vh = sh;
        vw = Math.round(vh * 9 / 16);
      } else {
        vw = sw;
        vh = Math.round(vw * 16 / 9);
      }

      vpEl.style.width = vw + 'px';
      vpEl.style.height = vh + 'px';

      const dpr = window.devicePixelRatio || 1;
      canvas.width = vw * dpr;
      canvas.height = vh * dpr;
      ctx.scale(dpr, dpr);

      vW = vw;
      vH = vh;
    }

    window.addEventListener('resize', applyViewport);
    applyViewport();

    // ==========================================
    // 3. 지도 이미지 및 내비게이션 줌
    // ==========================================
    const mapImg = new Image();
    mapImg.src = 'image/realmap.png';
    let mapLoaded = false;

    // 뷰포트 상태
    let viewX = 0, viewY = 0, viewScale = 1.0, viewRotation = 0;
    let isLocked = true; // 기본: 내 위치 및 방향 자동 추적 모드

    mapImg.onload = () => {
      mapLoaded = true;
      // 내비게이션 앱에 맞게 적당히 가까이 당겨진 기본 줌 (3.2배)
      viewScale = (Math.min(vW, vH) / Math.min(mapImg.width, mapImg.height)) * 3.2;
    };

    // ==========================================
    // 4. 좌표 변환 함수
    // ==========================================
    function worldToMap(rx, rz) {
      let nx = (rx - CONFIG.minX) / (CONFIG.maxX - CONFIG.minX);
      let nz = (rz - CONFIG.minZ) / (CONFIG.maxZ - CONFIG.minZ);
      if (CONFIG.invertX) nx = 1 - nx;
      if (CONFIG.invertZ) nz = 1 - nz;
      return { x: nx * mapImg.width, y: nz * mapImg.height };
    }

    // ==========================================
    // 5. 플레이어(GPS) 및 Roblox BUS 태그 차량 데이터
    // ==========================================
    let targetPlayer = null;
    const buses = new Map();

    function normalizeAngle(angle) {
      if (typeof angle !== 'number' || Number.isNaN(angle)) return 0;
      while (angle > Math.PI) angle -= Math.PI * 2;
      while (angle < -Math.PI) angle += Math.PI * 2;
      return angle;
    }

    function lerpAngle(current, target, amount) {
      let diff = normalizeAngle(target - current);
      return normalizeAngle(current + diff * amount);
    }

    function upsertBus(rawBus) {
      if (!rawBus || rawBus.x === undefined || rawBus.z === undefined) return;

      const id = String(rawBus.id || rawBus.name || `${rawBus.x},${rawBus.z}`);
      const nextAngle = normalizeAngle(rawBus.angle || 0);
      const existing = buses.get(id);

      if (!existing) {
        buses.set(id, {
          id,
          name: rawBus.name || '',
          route: rawBus.route || '',
          isHighFloor: rawBus.isHighFloor === true,
          curX: Number(rawBus.x),
          curZ: Number(rawBus.z),
          curAngle: nextAngle,
          targetX: Number(rawBus.x),
          targetZ: Number(rawBus.z),
          targetAngle: nextAngle,
          lastSeen: Date.now()
        });
        return;
      }

      existing.name = rawBus.name || existing.name;
      existing.route = rawBus.route || existing.route;
      existing.isHighFloor = rawBus.isHighFloor === true;
      existing.targetX = Number(rawBus.x);
      existing.targetZ = Number(rawBus.z);
      existing.targetAngle = nextAngle;
      existing.lastSeen = Date.now();
    }

    function replaceBuses(rawBuses) {
      const liveIds = new Set();
      (rawBuses || []).forEach((bus) => {
        const id = String(bus.id || bus.name || `${bus.x},${bus.z}`);
        liveIds.add(id);
        upsertBus(bus);
      });

      for (const [id, bus] of buses) {
        if (!liveIds.has(id) || Date.now() - bus.lastSeen > 5000) {
          buses.delete(id);
        }
      }
    }

    // ==========================================
    // 6. 60FPS 내비게이션 렌더링 루프
    // ==========================================
    let pulse = 0;

    function render() {
      requestAnimationFrame(render);

      const cw = vW, ch = vH;
      ctx.clearRect(0, 0, cw, ch);

      if (!mapLoaded) return;

      pulse += 0.05;

      if (targetPlayer) {
        // 부드러운 위치/각도 보간 (Lerp)
        targetPlayer.curX += (targetPlayer.targetX - targetPlayer.curX) * 0.22;
        targetPlayer.curZ += (targetPlayer.targetZ - targetPlayer.curZ) * 0.22;
        targetPlayer.curAngle = lerpAngle(targetPlayer.curAngle, targetPlayer.targetAngle, 0.22);
      }

      for (const bus of buses.values()) {
        bus.curX += (bus.targetX - bus.curX) * 0.2;
        bus.curZ += (bus.targetZ - bus.curZ) * 0.2;
        bus.curAngle = lerpAngle(bus.curAngle, bus.targetAngle, 0.2);
      }

      ctx.save();

      // [잠금 모드]: 플레이어가 화면 정중앙, 플레이어 진행 방향이 항상 화면 위쪽
      if (isLocked && targetPlayer) {
        const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);

        // 진행 방향 각도 보정
        let targetRotation = CONFIG.invertArrowX ? -targetPlayer.curAngle : targetPlayer.curAngle;
        targetRotation = targetRotation + Math.PI;

        // 최단 회전 보간
        let diff = targetRotation - viewRotation;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        viewRotation += diff * 0.12;

        // 화면 중심(약간 아래쪽 60% 지점 - 자동차 내비게이션처럼 앞 시야 확보)
        const centerScreenY = ch * 0.58;

        ctx.translate(cw / 2, centerScreenY);
        ctx.rotate(-viewRotation);
        ctx.scale(viewScale, viewScale);
        ctx.translate(-px, -py);

        // 지도 렌더링
        ctx.drawImage(mapImg, 0, 0);

        drawBusMarkers(ctx);

        // GPS 마커 렌더링
        drawGpsMarker(ctx, px, py, targetPlayer.curAngle);
        ctx.restore();

      } else {
        // [자유 이동 모드]: 정방향 자유 탐색
        ctx.translate(viewX, viewY);
        ctx.scale(viewScale, viewScale);

        ctx.drawImage(mapImg, 0, 0);

        drawBusMarkers(ctx);

        if (targetPlayer) {
          const { x: px, y: py } = worldToMap(targetPlayer.curX, targetPlayer.curZ);
          drawGpsMarker(ctx, px, py, targetPlayer.curAngle);
        }

        ctx.restore();
      }
    }

    function drawBusMarkers(ctx) {
      for (const bus of buses.values()) {
        const { x, y } = worldToMap(bus.curX, bus.curZ);
        drawBusMarker(ctx, x, y, bus.curAngle, bus);
      }
    }

    function drawBusMarker(ctx, px, py, angle, bus) {
      const width = 15;
      const height = 36;
      const routeText = String(bus.route || bus.name || 'BUS').slice(0, 8);
      const floorText = bus.isHighFloor ? '고상' : '저상';
      const fill = bus.isHighFloor ? '#f97316' : '#16a34a';

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(CONFIG.invertArrowX ? -angle : angle);

      // 진행 방향을 길쭉한 차체와 앞쪽 흰 선으로 표현합니다.
      ctx.fillStyle = 'rgba(15, 23, 42, 0.42)';
      ctx.fillRect(-width / 2 + 1.6, -height / 2 + 1.8, width, height);

      ctx.fillStyle = fill;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.1 / viewScale;
      roundRect(ctx, -width / 2, -height / 2, width, height, 2.5);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-width / 2 + 2.2, -height / 2 + 2.8, width - 4.4, 3);

      ctx.font = `${Math.max(8 / viewScale, 4.5)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 2 / viewScale;
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.78)';
      ctx.fillStyle = '#ffffff';
      ctx.save();
      ctx.rotate(-Math.PI / 2);
      ctx.strokeText(routeText, 0, 1);
      ctx.fillText(routeText, 0, 1);
      ctx.restore();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.moveTo(0, -height / 2 - 7);
      ctx.lineTo(5.2, -height / 2 - 1);
      ctx.lineTo(-5.2, -height / 2 - 1);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.font = `${Math.max(7 / viewScale, 4.5)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 2.4 / viewScale;
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillStyle = '#ffffff';
      ctx.strokeText(floorText, px, py + 12 / viewScale);
      ctx.fillText(floorText, px, py + 12 / viewScale);
      ctx.restore();
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // 세련된 모바일 GPS 내비게이션 위치 마커 (크기 축소 & 닉네임 미표시)
    function drawGpsMarker(ctx, px, py, angle) {
      const pulseR = 8 + Math.sin(pulse) * 3;

      // 1. 외곽 은은한 펄스 링 (내비게이션 GPS 느낌)
      ctx.beginPath();
      ctx.arc(px, py, pulseR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.lineWidth = 1.2 / viewScale;
      ctx.stroke();

      // 2. 방향 표시 삼각형 화살표 (축소된 크기)
      if (typeof angle === 'number') {
        ctx.save();
        ctx.translate(px, py);
        let ang = CONFIG.invertArrowX ? -angle : angle;
        ctx.rotate(ang);

        // 내비게이션 화살표 헤드
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.moveTo(0, -9.5);
        ctx.lineTo(4.2, -3.2);
        ctx.lineTo(-4.2, -3.2);
        ctx.closePath();
        ctx.fill();

        // 화살표 테두리
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.8 / viewScale;
        ctx.stroke();
        ctx.restore();
      }

      // 3. 중심 GPS 원형 닷 (반지름 3.5px)
      ctx.beginPath();
      ctx.arc(px, py, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#0284c7';
      ctx.fill();
      ctx.lineWidth = 1.2 / viewScale;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    requestAnimationFrame(render);

    // ==========================================
    // 7. Firebase 실시간 데이터 수신 (타겟 유저 단독 필터링)
    // ==========================================
    try {
      firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
      const db = firebase.database();

      function normalizeList(value) {
        if (!value) return [];
        return Array.isArray(value) ? value.filter(Boolean) : Object.values(value).filter(Boolean);
      }

      function updateTargetPlayer(players) {
        let list = normalizeList(players);
        if (list.length === 0) {
          targetPlayer = null;
          return;
        }

        // 발표 눈속임용: 지정된 TARGET_USER_NAME만 찾아서 추적
        let found = list.find(p => 
          (p.name && p.name.toLowerCase() === TARGET_USER_NAME.toLowerCase()) ||
          (p.displayName && p.displayName.toLowerCase() === TARGET_USER_NAME.toLowerCase())
        );

        // 혹시 닉네임이 다르더라도 끊기지 않도록 첫 번째 플레이어로 유연하게 대체
        if (!found && list.length > 0) {
          found = list[0];
        }

        if (found && found.x !== undefined) {
          if (!targetPlayer) {
            targetPlayer = {
              id: found.id,
              curX: found.x, curZ: found.z, curAngle: found.angle || 0,
              targetX: found.x, targetZ: found.z, targetAngle: found.angle || 0
            };
          } else {
            targetPlayer.targetX = found.x;
            targetPlayer.targetZ = found.z;
            targetPlayer.targetAngle = found.angle || 0;
          }
        }
      }

      db.ref('radar').on('value', (snap) => {
        const val = snap.val();
        if (!val) {
          targetPlayer = null;
          replaceBuses([]);
          return;
        }

        updateTargetPlayer(val.players);
        replaceBuses(normalizeList(val.buses));
      });

      // 예전 Roblox 스크립트가 /players만 보내는 경우에도 GPS는 계속 동작합니다.
      db.ref('players').on('value', (snap) => {
        updateTargetPlayer(snap.val());
      });
    } catch (e) {
      console.error("Firebase 초기화 에러:", e);
    }

    // ==========================================
    // 8. 모바일 터치 및 인터랙션 (잠금 / 자유 이동)
    // ==========================================
    const lockBtn = document.getElementById('lockBtn');
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function unlockToFreeMove() {
      if (isLocked) {
        isLocked = false;
        viewRotation = 0;
        lockBtn.classList.remove('active');
        showToast('자유 이동 모드 (과녁 클릭 시 내 위치 복귀)');
      }
    }

    // 과녁 버튼 클릭 시: 내 위치 추적 모드로 즉시 복귀
    lockBtn.addEventListener('click', () => {
      isLocked = true;
      viewRotation = 0;
      lockBtn.classList.add('active');
      toast.classList.remove('show');
    });

    // 드래그 & 터치 이동
    let isDrag = false;
    let dragSX = 0, dragSY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let activeTouches = new Map();

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      isDrag = true;
      dragSX = e.clientX - viewX;
      dragSY = e.clientY - viewY;
      unlockToFreeMove();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrag || isLocked) return;
      viewX = e.clientX - dragSX;
      viewY = e.clientY - dragSY;
    });

    canvas.addEventListener('pointerup', () => {
      isDrag = false;
    });

    // 모바일 멀티터치 핀치 줌
    canvas.addEventListener('touchstart', (e) => {
      for (const t of e.changedTouches) {
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }
      if (activeTouches.size === 2) {
        const pts = [...activeTouches.values()];
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        pinchStartScale = viewScale;
        isDrag = false;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }

      if (activeTouches.size === 2) {
        const pts = [...activeTouches.values()];
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        viewScale = Math.min(Math.max(pinchStartScale * (dist / pinchStartDist), 0.2), 8.0);
      } else if (activeTouches.size === 1 && !isLocked) {
        const [pt] = activeTouches.values();
        viewX = pt.x - dragSX;
        viewY = pt.y - dragSY;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      for (const t of e.changedTouches) {
        activeTouches.delete(t.identifier);
      }
    }, { passive: true });

    // 마우스 휠 줌
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      unlockToFreeMove();
      const factor = e.deltaY < 0 ? 1.15 : 0.85;
      viewScale = Math.min(Math.max(viewScale * factor, 0.2), 8.0);
    }, { passive: false });

    // 줌 버튼
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      viewScale = Math.min(viewScale * 1.3, 8.0);
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      viewScale = Math.max(viewScale * 0.75, 0.2);
    });
  </script>
</body>
</html>
